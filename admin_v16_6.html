<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم Al-Adeeb</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#f5f3ee;
--card:#fff;
--text:#17211e;
--muted:#68716c;
--line:#e3ddd2;
--accent:#9a6b35;
--danger:#9b3d35;
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,Tahoma,sans-serif;
line-height:1.8;
}

.wrap{
max-width:1000px;
width:94%;
margin:auto;
padding:25px 0 60px;
}

.box{
background:#fff;
border:1px solid var(--line);
border-radius:18px;
padding:20px;
margin:16px 0;
box-shadow:0 5px 20px #17211e0a;
}

h1{margin:0}

label{
display:block;
font-weight:bold;
margin:12px 0 5px;
}

input,
textarea,
select{
width:100%;
padding:12px;
border:1px solid #d8d1c6;
border-radius:10px;
font:inherit;
}

textarea{
min-height:150px;
resize:vertical;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.muted{
color:var(--muted);
font-size:13px;
}

.notice{
padding:12px;
background:#f7f2e8;
border-right:4px solid var(--accent);
border-radius:8px;
}

.status{
padding:11px;
border-radius:10px;
background:#eee;
margin-top:12px;
}

.ok{background:#e4f4e9}
.warn{background:#fff1d6}

.hidden{display:none}

.item{
border:1px solid var(--line);
border-radius:14px;
padding:15px;
margin:10px 0;
}

.top{
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
}

.tag{
color:var(--accent);
font-size:13px;
font-weight:bold;
}

.editor{
border-top:1px solid var(--line);
margin-top:14px;
padding-top:12px;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px;
}

button{
border:0;
border-radius:10px;
padding:11px 17px;
background:var(--text);
color:white;
font-weight:bold;
cursor:pointer;
}

button.accent{background:var(--accent)}
button.danger{background:var(--danger)}
button.light{
background:#ece9e3;
color:var(--text);
}

.upload{
border:1px dashed #b9afa0;
padding:14px;
border-radius:10px;
background:#faf8f4;
}

.preview{
max-width:180px;
max-height:120px;
margin-top:10px;
border-radius:8px;
display:none;
}

.cat-buttons{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:6px;
}

.cat-buttons button{
background:#ece9e3;
color:var(--text);
padding:8px 13px;
}

.cat-buttons button.active{
background:var(--accent);
color:#fff;
}

/* =========================
   RICH TEXT EDITOR
========================= */

.rich-wrap{
border:1px solid #d8d1c6;
border-radius:14px;
overflow:hidden;
background:#fff;
margin-top:5px;
}

.toolbar{
display:flex;
align-items:center;
gap:5px;
flex-wrap:wrap;
padding:9px;
background:#f4f1eb;
border-bottom:1px solid #ddd6ca;
position:sticky;
top:0;
z-index:10;
}

.toolbar button,
.toolbar select,
.toolbar input{
width:auto;
margin:0;
padding:7px 9px;
border:1px solid #d8d1c6;
border-radius:7px;
background:#fff;
color:var(--text);
font:inherit;
cursor:pointer;
}

.toolbar button{
font-weight:bold;
min-width:38px;
}

.toolbar button:hover,
.toolbar select:hover{
background:#eee8de;
}

.toolbar .sep{
width:1px;
height:30px;
background:#d8d1c6;
margin:0 3px;
}

.toolbar .font-select{
min-width:150px;
}

.toolbar .size-select{
min-width:115px;
}

.rich-editor{
min-height:360px;
padding:20px;
outline:none;
line-height:2;
font-size:19px;
direction:rtl;
text-align:right;
overflow:auto;
}

.rich-editor:empty:before{
content:attr(data-placeholder);
color:#999;
}

.rich-editor img{
max-width:100%;
height:auto;
border-radius:10px;
margin:10px 0;
}

.rich-editor blockquote{
border-right:4px solid var(--accent);
margin:18px 0;
padding:10px 16px;
background:#faf7f1;
color:#555;
}

.rich-editor h2{
font-size:30px;
margin:22px 0 12px;
}

.rich-editor h3{
font-size:24px;
margin:20px 0 10px;
}

.rich-editor ul,
.rich-editor ol{
padding-right:30px;
}

.rich-editor a{
color:var(--accent);
text-decoration:underline;
}

.editor-info{
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
padding:8px 12px;
background:#faf8f4;
border-top:1px solid #eee7dc;
color:#777;
font-size:12px;
}

/* الخطوط داخل المحرر */

.font-amiri{
font-family:"Amiri",serif;
}

.font-naskh{
font-family:"Noto Naskh Arabic",serif;
}

.font-cairo{
font-family:"Cairo",sans-serif;
}

.font-tajawal{
font-family:"Tajawal",sans-serif;
}

.font-scheherazade{
font-family:"Scheherazade New",serif;
}

.font-georgia{
font-family:Georgia,serif;
}

.font-arial{
font-family:Arial,sans-serif;
}

/* معاينة */

.preview-box{
border:1px solid var(--line);
border-radius:12px;
background:#faf8f4;
padding:18px;
margin-top:12px;
}

.preview-box h3{
margin-top:0;
}

@media(max-width:650px){

.row{
grid-template-columns:1fr;
}

.top{
display:block;
}

.actions button{
flex:1;
}

.toolbar{
position:relative;
}

.toolbar button{
padding:7px 8px;
}

.toolbar .font-select{
min-width:125px;
}

.toolbar .size-select{
min-width:100px;
}

.rich-editor{
min-height:300px;
font-size:18px;
}

}
</style>
</head>

<body>

<main class="wrap">

<h1>لوحة تحكم Al-Adeeb</h1>
<p class="muted">
إدارة الموقع والمقالات والكتب والنشر إلى GitHub.
</p>

<!-- =========================
     GITHUB
========================= -->

<section class="box">

<h2>ربط GitHub</h2>

<div class="notice">
التوكن يبقى في ذاكرة الصفحة ولا يُكتب داخل الملفات.
</div>

<div class="row">

<div>
<label>اسم المستخدم</label>
<input id="user" value="3li3deeb">
</div>

<div>
<label>اسم المستودع</label>
<input id="repo" value="Ali-Adeeb">
</div>

</div>

<label>GitHub Fine-grained Token</label>

<input
id="token"
type="password"
autocomplete="off"
placeholder="الصق التوكن هنا">

<p class="muted">
يحتاج Contents: Read and write.
</p>

<div class="actions">

<button onclick="connect()">
اتصال وقراءة المحتوى
</button>

<button class="light" onclick="clearToken()">
مسح التوكن
</button>

<div id="status" class="status">

</div>

</section>


<div id="app" class="hidden">

<!-- =========================
     SITE SETTINGS
========================= -->

<section class="box">

<h2>إعدادات الموقع</h2>

<label>اسم الموقع</label>
<input id="siteName">

<label>العنوان المختصر</label>
<input id="siteTagline">

<label>وصف الموقع</label>
<textarea id="siteDesc"></textarea>

<button class="accent" onclick="saveSite()">
حفظ الإعدادات
</button>

</section>


<!-- =========================
     ARTICLES
========================= -->

<section class="box">

<h2>المقالات</h2>

<div id="articles"></div>

<button onclick="newArticle()">
＋ إضافة مقال
</button>

</section>


<!-- =========================
     BOOKS
========================= -->

<section class="box">

<h2>الكتب</h2>

<div id="books"></div>

<button onclick="newBook()">
＋ إضافة كتاب
</button>

</section>


<!-- =========================
     PUBLISH
========================= -->

<section class="box">

<h2>النشر</h2>

<p class="muted">
بعد التعديلات اضغط نشر التغييرات.
</p>

<button class="accent" onclick="publish()">
نشر التغييرات
</button>

<div id="pub" class="status">
لم يتم النشر بعد.
</div>

</section>

</div>

</main>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let D=null;
let SHA=null;

const $=id=>document.getElementById(id);

const v=id=>$(id).value.trim();

const categories=[
"متنوع",
"ثقافة",
"فكر",
"علم",
"تاريخ",
"أدب",
"مجتمع",
"تقنية",
"دين",
"أخبار"
];

let savedSelections={};


/* =========================================================
   GITHUB API
========================================================= */

const api=()=>`https://api.github.com/repos/${v('user')}/${v('repo')}/contents/content.json`;

async function gh(method,url,body){

let response=await fetch(url,{
method,
headers:{
Authorization:'Bearer '+v('token'),
Accept:'application/vnd.github+json',
'Content-Type':'application/json'
},
body:body?JSON.stringify(body):undefined
});

let data=await response.json();

if(!response.ok){
throw Error(data.message||response.status);
}

return data;
}


/* =========================================================
   ENCODE / DECODE
========================================================= */

function decode(c){

let bin=atob(c.replace(/\n/g,''));

let bytes=Uint8Array.from(
bin,
x=>x.charCodeAt(0)
);

return JSON.parse(
new TextDecoder().decode(bytes)
);
}


function encode(s){

let bytes=new TextEncoder().encode(s);

let bin='';

for(
let i=0;
i<bytes.length;
i+=8192
){
bin+=String.fromCharCode(
...bytes.subarray(i,i+8192)
);
}

return btoa(bin);
}


/* =========================================================
   ESCAPE
========================================================= */

function esc(s){

return String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}


/* =========================================================
   UPLOAD FILE
========================================================= */

async function uploadFile(file,path){

if(!file){
throw Error('لم يتم اختيار ملف.');
}

let buffer=await file.arrayBuffer();

let bytes=new Uint8Array(buffer);

let bin='';

for(
let i=0;
i<bytes.length;
i+=8192
){

bin+=String.fromCharCode(
...bytes.subarray(i,i+8192)
);

}

let content=btoa(bin);

let url=
`https://api.github.com/repos/${v('user')}/${v('repo')}/contents/${path}`;

let existing=null;

try{
existing=await gh('GET',url);
}catch(e){}

let body={
message:'Upload '+path,
content:content
};

if(existing?.sha){
body.sha=existing.sha;
}

let result=await gh('PUT',url,body);

return result;
}


/* =========================================================
   CONNECT
========================================================= */

async function connect(){

try{

$('status').textContent=
'جاري الاتصال بـ GitHub...';

$('status').className='status';

let r=await gh(
'GET',
api()
);

if(!r.content||!r.sha){
throw Error(
'تعذر قراءة content.json.'
);
}

SHA=r.sha;

D=decode(r.content);

D.site=D.site||{};
D.articles=D.articles||[];
D.books=D.books||[];

$('app').classList.remove('hidden');

loadSite();

render();

$('status').textContent=
'تم الاتصال بنجاح ✓';

$('status').className=
'status ok';

}catch(e){

$('status').textContent=
'فشل الاتصال: '+e.message;

$('status').className=
'status warn';

}

}


/* =========================================================
   CLEAR TOKEN
========================================================= */

function clearToken(){

$('token').value='';

$('status').textContent=
'تم مسح التوكن';

$('status').className='status';

}


/* =========================================================
   SITE
========================================================= */

function loadSite(){

$('siteName').value=
D.site.name||'Al-Adeeb';

$('siteTagline').value=
D.site.tagline||'مساحة للقراءة والفكرة';

$('siteDesc').value=
D.site.description||'';

}


function saveSite(){

D.site.name=
v('siteName')||'Al-Adeeb';

D.site.tagline=
v('siteTagline');

D.site.description=
v('siteDesc');

alert(
'تم الحفظ مؤقتاً. اضغط نشر التغييرات.'
);

}


/* =========================================================
   CATEGORY BUTTONS
========================================================= */

function catBtns(i,val){

let current=
val||'متنوع';

return `

<div class="cat-buttons">

${categories.map(c=>`

<button
type="button"
class="${c===current?'active':''}"
onclick="setCat(${i},'${c}')">

${c}

</button>

`).join('')}

</div>

<input
id="ac${i}"
value="${esc(current)}"
readonly
style="margin-top:7px">

`;

}


function setCat(i,c){

let input=$('ac'+i);

if(input){
input.value=c;
}

savedSelections[i]=c;

document
.querySelectorAll(`#ae${i} .cat-buttons button`)
.forEach(btn=>{
btn.classList.toggle(
'active',
btn.textContent.trim()===c
);
});

}


/* =========================================================
   RENDER
========================================================= */

function render(){

/* =========================
   ARTICLES
========================= */

$('articles').innerHTML=
D.articles.map((x,i)=>`

<div class="item">

<div class="top">

<div>

<b>
${esc(x.title||'بدون عنوان')}
</b>

<div class="tag">
${esc(x.category||'متنوع')}
 ·
${esc(x.date||'')}
</div>

</div>

<div class="actions">

<button onclick="toggle('ae${i}')">
تعديل
</button>

<button
class="danger"
onclick="delA(${i})">
حذف
</button>

</div>

</div>


<div
id="ae${i}"
class="editor hidden">

<label>
عنوان المقال
</label>

<input
id="at${i}"
value="${esc(x.title||'')}">


<label>
القسم — اختر بنقرة
</label>

${catBtns(i,x.category)}


<div class="row">

<div>

<label>
التاريخ
</label>

<input
id="ad${i}"
type="date"
value="${esc(x.date||'')}">

</div>


<div>

<label>
صورة المقال
</label>

<div class="upload">

<input
id="ai${i}"
type="file"
accept="image/*"
onchange="previewImage(this,'ap${i}')">

<small>
اختيار صورة من الهاتف ثم حفظ المقال.
</small>

<img
id="ap${i}"
class="preview"
${x.image?`src="${esc(x.image)}" style="display:block"`:''}>

</div>

</div>

</div>


<label>
المقدمة
</label>

<textarea id="ax${i}">
${esc(x.excerpt||'')}
</textarea>


<label>
نص المقال
</label>


${richEditorHTML(i,x.body||'')}


<div class="actions">

<button
class="accent"
onclick="saveA(${i})">

حفظ المقال

</button>

<button
class="light"
onclick="previewArticle(${i})">

معاينة المقال

</button>

</div>

</div>

</div>

`).join('') ||

'<p class="muted">لا توجد مقالات.</p>';


/* =========================
   BOOKS
========================= */

$('books').innerHTML=
D.books.map((x,i)=>`

<div class="item">

<div class="top">

<div>

<b>
${esc(x.title||'بدون عنوان')}
</b>

<div class="tag">
كتاب
</div>

</div>

<div class="actions">

<button onclick="toggle('be${i}')">
تعديل
</button>

<button
class="danger"
onclick="delB(${i})">
حذف
</button>

</div>

</div>


<div
id="be${i}"
class="editor hidden">

<label>
عنوان الكتاب
</label>

<input
id="bt${i}"
value="${esc(x.title||'')}">


<label>
المؤلف
</label>

<input
id="ba${i}"
value="${esc(x.author||'')}">


<label>
صورة الغلاف
</label>

<div class="upload">

<input
id="bi${i}"
type="file"
accept="image/*"
onchange="previewImage(this,'bp${i}')">

<small>
اختيار الغلاف من الهاتف.
</small>

<img
id="bp${i}"
class="preview"
${x.image?`src="${esc(x.image)}" style="display:block"`:''}>

</div>


<label>
ملف PDF للكتاب
</label>

<div class="upload">

<input
id="bf${i}"
type="file"
accept="application/pdf">

<small>
سيتم رفع PDF إلى المستودع وتشغيله داخل صفحة الكتاب.
</small>

${x.file?`
<div class="muted">
الملف الحالي: ${esc(x.file)}
</div>
`:''}

</div>


<label>
وصف الكتاب
</label>

<textarea id="bd${i}">
${esc(x.description||'')}
</textarea>


<div class="actions">

<button
class="accent"
onclick="saveB(${i})">

حفظ الكتاب

</button>

</div>

</div>

</div>

`).join('') ||

'<p class="muted">لا توجد كتب.</p>';

}

   RICH EDITOR HTML
========================================================= */

/* =========================================================
   EDITOR SELECTION
========================================================= */

let savedRange=null;


function getActiveEditor(){

let active=document.activeElement;

if(
active &&
active.classList &&
active.classList.contains('rich-editor')
){
return active;
}

return document.querySelector('.rich-editor');
}


function saveSelection(){

let selection=window.getSelection();

if(!selection||selection.rangeCount===0){
return;
}

let range=selection.getRangeAt(0);

let editor=
range.commonAncestorContainer.nodeType===1
?
range.commonAncestorContainer.closest?.('.rich-editor')
:
range.commonAncestorContainer.parentElement?.closest?.('.rich-editor');

if(editor){

savedRange={
range:range.cloneRange(),
editor:editor
};

}

}


function restoreSelection(){

if(!savedRange){
return;
}

let selection=window.getSelection();

selection.removeAllRanges();

try{
selection.addRange(
savedRange.range
);

savedRange.editor.focus();

}catch(e){}

}


/* =========================================================
   TOOLBAR
========================================================= */

function toolbarMouseDown(e){

if(
e.target.closest('button') ||
e.target.closest('select') ||
e.target.closest('input')
){

saveSelection();

}

}


function toolbarClick(e){

let button=e.target.closest('[data-command]');

if(button){

restoreSelection();

let command=
button.getAttribute('data-command');

richCmd(command);

}

}


/* =========================================================
   EDITOR COMMANDS
========================================================= */

function richCmd(command,value=null){

restoreSelection();

let editor=
savedRange?.editor ||
getActiveEditor();

if(!editor){
return;
}

editor.focus();

document.execCommand(
command,
false,
value
);

saveSelection();

}


/* =========================================================
   FONT
========================================================= */

function richFont(font){

restoreSelection();

let editor=
savedRange?.editor ||
getActiveEditor();

if(!editor)return;

editor.focus();

let selection=window.getSelection();

if(!selection.rangeCount){
return;
}

let range=selection.getRangeAt(0);

if(range.collapsed){

document.execCommand(
'fontName',
false,
font
);

}else{

document.execCommand(
'fontName',
false,
font
);

}

saveSelection();

}


/* =========================================================
   FONT SIZE
========================================================= */

function richFontSize(size){

restoreSelection();

let editor=
savedRange?.editor ||
getActiveEditor();

if(!editor)return;

editor.focus();

let selection=window.getSelection();

if(!selection.rangeCount){
return;
}

let range=selection.getRangeAt(0);

if(range.collapsed){
return;
}

let span=document.createElement('span');

span.style.fontSize=size;

try{

range.surroundContents(span);

}catch(e){

let fragment=
range.extractContents();

span.appendChild(fragment);

range.insertNode(span);

}

saveSelection();

}

/* =========================================================
   LINK
========================================================= */

function richLink(){

restoreSelection();

let url=prompt(
'أدخل رابط الموقع:'
);

if(!url){
return;
}

if(
!/^https?:\/\//i.test(url)
){
url='https://'+url;
}

richCmd(
'createLink',
url
);

}


/* =========================================================
   IMAGE INSIDE ARTICLE
========================================================= */

async function richImage(){

let editor=
savedRange?.editor ||
getActiveEditor();

if(!editor){
alert('ضع المؤشر داخل نص المقال أولاً.');
return;
}

let input=document.createElement('input');

input.type='file';
input.accept='image/*';

input.onchange=async()=>{

let file=input.files[0];

if(!file)return;

try{

let articleId=
editor.id.replace('ab','');

let article=
D.articles[parseInt(articleId)];

if(!article){
throw Error('تعذر تحديد المقال.');
}

let ext=
(file.name.split('.').pop()||'jpg')
.toLowerCase();

let path=
`assets/articles/${article.id}-inline-${Date.now()}.${ext}`;

let result=
await uploadFile(file,path);

restoreSelection();

editor.focus();

let img=document.createElement('img');

img.src=path;
img.alt='';
img.style.maxWidth='100%';
img.style.borderRadius='10px';

let selection=window.getSelection();

if(selection.rangeCount){

let range=selection.getRangeAt(0);

range.collapse(false);

range.insertNode(img);

range.setStartAfter(img);
range.collapse(true);

selection.removeAllRanges();
selection.addRange(range);

}

saveSelection();

alert(
'تم رفع الصورة وإدراجها داخل المقال.'
);

}catch(e){

alert(
'تعذر رفع الصورة: '+e.message
);

}

};

input.click();

}
