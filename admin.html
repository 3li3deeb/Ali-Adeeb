<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم Ali Adeeb V5</title>
<style>
body{margin:0;background:#f5f3ee;color:#17211e;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:920px;width:92%;margin:auto;padding:28px 0 60px}.box{background:#fff;border:1px solid #e3ddd2;border-radius:16px;padding:22px;margin:16px 0}label{display:block;font-weight:bold;margin:14px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #d9d2c7;border-radius:9px;font:inherit;box-sizing:border-box}textarea{min-height:130px}button{border:0;border-radius:9px;padding:11px 18px;background:#17211e;color:white;font-weight:bold;cursor:pointer;margin:6px 4px 0 0}.danger{background:#9b3d35}.muted{color:#68716c;font-size:13px}.item{border:1px solid #e3ddd2;border-radius:12px;padding:15px;margin:10px 0}.status{padding:10px;border-radius:9px;background:#eee}.ok{background:#e2f3e8}.warn{background:#fff3d9}.preview{display:none;max-width:100%;max-height:240px;border-radius:12px;margin-top:10px;border:1px solid #ddd}.cats{display:flex;gap:8px;flex-wrap:wrap}.cat{background:#eee;border-radius:20px;padding:5px 10px;font-size:13px}
</style></head><body><div class="wrap"><h1>لوحة تحكم Ali Adeeb</h1><p class="muted">V5 — التصنيفات + المقالات والكتب + رفع الصور.</p>
<div class="box"><h2>ربط GitHub</h2><label>اسم المستخدم</label><input id="user" value="3li3deeb"><label>اسم المستودع</label><input id="repo" value="Ali-Adeeb"><label>GitHub Fine-grained Token</label><input id="token" type="password" placeholder="الصق التوكن هنا"><p class="muted">Contents: Read and write للمستودع فقط.</p><button onclick="connect()">اتصال وقراءة المحتوى</button><div id="status" class="status">غير متصل</div></div>
<div id="app" class="hidden"><div class="box"><h2>التصنيفات</h2><p class="muted">التصنيفات تُنشأ تلقائيًا من المقالات التي تضيفها. اكتب اسم التصنيف عند إضافة المقال.</p><div id="cats" class="cats"></div></div>
<div class="box"><h2>المقالات</h2><div id="articles"></div><button onclick="addA()">+ إضافة مقال</button></div>
<div class="box"><h2>الكتب</h2><div id="books"></div><button onclick="addB()">+ إضافة كتاب</button></div>
<div class="box"><h2>النشر</h2><button onclick="publish()">نشر التغييرات</button><div id="pub" class="status">لم يتم النشر بعد.</div></div></div></div>
<script>
let D=null,SHA=null,$=x=>document.getElementById(x),v=x=>$(x).value;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function api(path='content.json'){return `https://api.github.com/repos/${encodeURIComponent(v('user'))}/${encodeURIComponent(v('repo'))}/contents/${path}`}
async function gh(method,url,body){let r=await fetch(url,{method,headers:{Authorization:'Bearer '+v('token'),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}),j=await r.json();if(!r.ok)throw Error(j.message||r.status);return j}
function dec(s){const b=atob(s.replace(/\n/g,'')),a=Uint8Array.from(b,c=>c.charCodeAt(0));return new TextDecoder().decode(a)}
function enc(s){const a=new TextEncoder().encode(s);let b='';a.forEach(x=>b+=String.fromCharCode(x));return btoa(b)}
async function connect(){try{status.textContent='جاري الاتصال...';let r=await gh('GET',api());SHA=r.sha;D=JSON.parse(dec(r.content));D.articles=D.articles||[];D.books=D.books||[];app.classList.remove('hidden');render();status.textContent='تم الاتصال بنجاح';status.className='status ok'}catch(e){status.textContent='فشل الاتصال: '+e.message;status.className='status warn'}}
function render(){let cs=[...new Set(D.articles.map(x=>x.category||'متنوع'))];cats.innerHTML=cs.map(x=>`<span class="cat">${esc(x)}</span>`).join('')||'<span class="muted">لا توجد تصنيفات بعد.</span>';articles.innerHTML=D.articles.map((x,i)=>`<div class="item"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.category||'متنوع')}</span>${x.image?'<br>🖼️ توجد صورة':''}<br><button onclick="editA(${i})">تعديل</button><button class="danger" onclick="delA(${i})">حذف</button></div>`).join('')||'<p class="muted">لا توجد مقالات.</p>';books.innerHTML=D.books.map((x,i)=>`<div class="item"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.description||'')}</span>${x.image?'<br>🖼️ توجد صورة':''}<br><button onclick="editB(${i})">تعديل</button><button class="danger" onclick="delB(${i})">حذف</button></div>`).join('')||'<p class="muted">لا توجد كتب.</p>'}
function addA(){D.articles.push({id:'article-'+Date.now(),title:'مقال جديد',category:'متنوع',excerpt:'',body:'',date:new Date().toISOString().slice(0,10),image:''});render();editA(D.articles.length-1)}
function addB(){D.books.push({id:'book-'+Date.now(),title:'كتاب جديد',description:'',url:'',date:new Date().toISOString().slice(0,10),image:''});render();editB(D.books.length-1)}
function editA(i){let x=D.articles[i],b=document.createElement('div');b.className='box';b.innerHTML=`<h2>تعديل المقال</h2><label>العنوان</label><input id="t" value="${esc(x.title)}"><label>التصنيف</label><input id="c" list="catlist" value="${esc(x.category||'متنوع')}"><datalist id="catlist">${[...new Set(D.articles.map(a=>a.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist><label>المقدمة</label><textarea id="e">${esc(x.excerpt||'')}</textarea><label>نص المقال</label><textarea id="body">${esc(x.body||'')}</textarea><label>صورة الغلاف</label><input id="file" type="file" accept="image/*"><img id="prev" class="preview" ${x.image?`src="${esc(x.image)}" style="display:block"`:''}><p class="muted">الحد الأقصى 4 MB.</p><button onclick="saveA(${i},this)">حفظ المقال</button><button class="danger" onclick="this.parentElement.remove()">إلغاء</button>`;document.querySelector('.wrap').insertBefore(b,app);b.querySelector('#file').onchange=()=>{let f=b.querySelector('#file').files[0];if(f){b.querySelector('#prev').src=URL.createObjectURL(f);b.querySelector('#prev').style.display='block'}};b.scrollIntoView({behavior:'smooth'})}
function editB(i){let x=D.books[i],b=document.createElement('div');b.className='box';b.innerHTML=`<h2>تعديل الكتاب</h2><label>العنوان</label><input id="bt" value="${esc(x.title)}"><label>الوصف</label><textarea id="bd">${esc(x.description||'')}</textarea><label>رابط الكتاب / PDF</label><input id="bu" value="${esc(x.url||'')}"><label>صورة الغلاف</label><input id="bf" type="file" accept="image/*"><img id="bp" class="preview" ${x.image?`src="${esc(x.image)}" style="display:block"`:''}><p class="muted">الحد الأقصى 4 MB.</p><button onclick="saveB(${i},this)">حفظ الكتاب</button><button class="danger" onclick="this.parentElement.remove()">إلغاء</button>`;document.querySelector('.wrap').insertBefore(b,app);b.querySelector('#bf').onchange=()=>{let f=b.querySelector('#bf').files[0];if(f){b.querySelector('#bp').src=URL.createObjectURL(f);b.querySelector('#bp').style.display='block'}};b.scrollIntoView({behavior:'smooth'})}
function file64(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)})}
async function uploadImage(file,folder){if(file.size>4*1024*1024)throw Error('حجم الصورة أكبر من 4 MB');let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`assets/${folder}/${Date.now()}-${safe}`;let r=await gh('PUT',api(path),{message:'Upload image '+safe,content:await file64(file)});return r.content.path}
async function saveA(i,btn){try{btn.disabled=true;btn.textContent='جاري الحفظ...';let x=D.articles[i],box=btn.parentElement;x.title=box.querySelector('#t').value;x.category=box.querySelector('#c').value.trim()||'متنوع';x.excerpt=box.querySelector('#e').value;x.body=box.querySelector('#body').value;let f=box.querySelector('#file').files[0];if(f)x.image=await uploadImage(f,'articles/'+x.id);box.remove();render()}catch(e){alert('تعذر حفظ المقال: '+e.message);btn.disabled=false;btn.textContent='حفظ المقال'}}
async function saveB(i,btn){try{btn.disabled=true;btn.textContent='جاري الحفظ...';let x=D.books[i],box=btn.parentElement;x.title=box.querySelector('#bt').value;x.description=box.querySelector('#bd').value;x.url=box.querySelector('#bu').value;let f=box.querySelector('#bf').files[0];if(f)x.image=await uploadImage(f,'books/'+x.id);box.remove();render()}catch(e){alert('تعذر حفظ الكتاب: '+e.message);btn.disabled=false;btn.textContent='حفظ الكتاب'}}
function delA(i){if(confirm('حذف المقال؟')){D.articles.splice(i,1);render()}}function delB(i){if(confirm('حذف الكتاب؟')){D.books.splice(i,1);render()}}
async function publish(){try{pub.textContent='جاري النشر...';let r=await gh('PUT',api(),{message:'Update site content',content:enc(JSON.stringify(D,null,2)),sha:SHA});SHA=r.content.sha;pub.textContent='تم نشر التغييرات بنجاح.';pub.className='status ok'}catch(e){pub.textContent='فشل النشر: '+e.message;pub.className='status warn'}}
</script></body></html>
