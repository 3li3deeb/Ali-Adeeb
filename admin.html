<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ali Adeeb | لوحة التحكم V8</title>
<style>
body{margin:0;background:#f5f3ee;color:#17211e;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:980px;width:92%;margin:auto;padding:24px 0 60px}.box{background:white;border:1px solid #e3ddd2;border-radius:16px;padding:20px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7f5f0;border-radius:12px;padding:14px}.stat b{display:block;font-size:27px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:180px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9d2c7;border-radius:9px;font:inherit}textarea{min-height:130px}label{display:block;font-weight:bold;margin:12px 0 5px}button{border:0;border-radius:9px;padding:10px 15px;background:#17211e;color:white;font-weight:bold;cursor:pointer;margin:5px 3px 0 0}.secondary{background:#eee8df;color:#17211e}.danger{background:#9b3d35}.item{border:1px solid #e3ddd2;border-radius:12px;padding:14px;margin:9px 0}.muted{color:#68716c;font-size:13px}.badge{display:inline-block;background:#eee8df;border-radius:20px;padding:3px 9px;font-size:12px;margin:3px}.status{padding:10px;border-radius:9px;background:#eee;margin-top:10px}.ok{background:#e2f3e8}.warn{background:#fff3d9}.preview{display:none;max-width:100%;max-height:230px;border-radius:12px;margin-top:10px}.hidden{display:none!important}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tab{background:white;color:#68716c;border:1px solid #ddd}.tab.active{background:#17211e;color:white}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<h1>لوحة تحكم Ali Adeeb — V8</h1><p class="muted">إدارة المقالات والكتب والتصنيفات والنشر من الهاتف.</p>
<div class="box"><h2>الإحصائيات</h2><div class="stats"><div class="stat">المقالات<b id="sa">0</b></div><div class="stat">الكتب<b id="sb">0</b></div><div class="stat">التصنيفات<b id="sc">0</b></div><div class="stat">المميز<b id="sf">0</b></div></div></div>
<div class="box"><h2>الاتصال</h2><label>اسم المستخدم</label><input id="user" value="3li3deeb"><label>اسم المستودع</label><input id="repo" value="Ali-Adeeb"><label>GitHub Fine-grained Token</label><input id="token" type="password" placeholder="الصق التوكن هنا"><p class="muted">التوكن لا يُحفظ داخل content.json.</p><button onclick="connect()">اتصال وقراءة المحتوى</button><button class="secondary" onclick="window.open('index.html','_blank')">فتح الموقع</button><div id="status" class="status">غير متصل</div></div>
<div id="app" class="hidden">
<div class="box"><h2>المقالات</h2><div class="toolbar"><input id="aq" placeholder="بحث..." oninput="renderArticles()"><button onclick="addA()">+ مقال جديد</button></div><div id="tabs" class="tabs"></div><div id="articles"></div></div>
<div class="box"><h2>الكتب</h2><div class="toolbar"><input id="bq" placeholder="بحث..." oninput="renderBooks()"><button onclick="addB()">+ كتاب جديد</button></div><div id="books"></div></div>
<div class="box"><h2>إعدادات الصفحة</h2><label>الشعار القصير</label><input id="tagline"><label>وصف الموقع</label><textarea id="sitedesc"></textarea><button onclick="saveSettings()">حفظ</button></div>
<div class="box"><h2>النشر</h2><button onclick="publish()">نشر جميع التغييرات</button><div id="pub" class="status">جاهز.</div></div>
</div></div>
<script>
let D=null,SHA=null,filter='الكل';const $=x=>document.getElementById(x),v=x=>$(x).value;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function api(p='content.json'){return `https://api.github.com/repos/${encodeURIComponent(v('user'))}/${encodeURIComponent(v('repo'))}/contents/${p}`}
async function gh(m,u,b){let r=await fetch(u,{method:m,headers:{Authorization:'Bearer '+v('token'),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}),j=await r.json();if(!r.ok)throw Error(j.message||r.status);return j}
function dec(s){let b=atob(s.replace(/\n/g,'')),a=Uint8Array.from(b,c=>c.charCodeAt(0));return new TextDecoder().decode(a)}function enc(s){let a=new TextEncoder().encode(s),b='';a.forEach(x=>b+=String.fromCharCode(x));return btoa(b)}
async function connect(){try{$('status').textContent='جاري الاتصال...';let r=await gh('GET',api());SHA=r.sha;D=JSON.parse(dec(r.content));D.articles=D.articles||[];D.books=D.books||[];D.site=D.site||{};$('app').classList.remove('hidden');$('tagline').value=D.site.tagline||'';$('sitedesc').value=D.site.description||'';render();$('status').textContent='تم الاتصال بنجاح';$('status').className='status ok'}catch(e){$('status').textContent='فشل الاتصال: '+e.message;$('status').className='status warn'}}
function render(){let c=[...new Set(D.articles.map(x=>x.category||'متنوع'))];sa.textContent=D.articles.length;sb.textContent=D.books.length;sc.textContent=c.length;sf.textContent=D.articles.filter(x=>x.featured).length;tabs.innerHTML=['الكل',...c].map(x=>`<button class="tab ${x===filter?'active':''}" onclick="filter='${esc(x)}';render()">${esc(x)}</button>`).join('');renderArticles();renderBooks()}
function renderArticles(){let q=aq.value.trim().toLowerCase(),a=D.articles.filter(x=>(filter==='الكل'||(x.category||'متنوع')===filter)&&(x.title+' '+(x.category||'')).toLowerCase().includes(q));articles.innerHTML=a.map(x=>{let i=D.articles.indexOf(x);return `<div class="item"><b>${esc(x.title)}</b><br><span class="badge">${esc(x.category||'متنوع')}</span> ${x.featured?'<span class="badge">⭐ مميز</span>':''}<br><button onclick="editA(${i})">تعديل</button><button class="secondary" onclick="feature(${i})">${x.featured?'إلغاء المميز':'⭐ مميز'}</button><button class="danger" onclick="delA(${i})">حذف</button></div>`}).join('')||'<p class="muted">لا توجد نتائج.</p>'}
function renderBooks(){let q=bq.value.trim().toLowerCase();books.innerHTML=D.books.filter(x=>(x.title+' '+(x.author||'')).toLowerCase().includes(q)).map(x=>{let i=D.books.indexOf(x);return `<div class="item"><b>${esc(x.title)}</b><br><span class="badge">${esc(x.author||'المؤلف غير محدد')}</span> ${x.url?'<span class="badge">📄 PDF</span>':''}<br><button onclick="editB(${i})">تعديل</button><button class="danger" onclick="delB(${i})">حذف</button></div>`}).join('')||'<p class="muted">لا توجد كتب.</p>'}
function addA(){D.articles.push({id:'article-'+Date.now(),title:'مقال جديد',category:'متنوع',excerpt:'',body:'',date:new Date().toISOString().slice(0,10),image:'',featured:false});render();editA(D.articles.length-1)}
function addB(){D.books.push({id:'book-'+Date.now(),title:'كتاب جديد',author:'',description:'',url:'',date:new Date().toISOString().slice(0,10),image:''});render();editB(D.books.length-1)}
function preview(b,a,c){let f=b.querySelector('#'+a).files[0];if(f){let o=b.querySelector('#'+c);o.src=URL.createObjectURL(f);o.style.display='block'}}
function file64(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)})}
async function upload(f,folder,max){if(f.size>max*1024*1024)throw Error('حجم الملف أكبر من '+max+' MB');let n=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),p=`assets/${folder}/${Date.now()}-${n}`,r=await gh('PUT',api(p),{message:'Upload '+n,content:await file64(f)});return r.content.download_url}
function box(h){let b=document.createElement('div');b.className='box';b.innerHTML=h;$('app').before(b);b.scrollIntoView({behavior:'smooth'});return b}
function editA(i){let x=D.articles[i],b=box(`<h2>تعديل المقال</h2><label>العنوان</label><input id="t" value="${esc(x.title)}"><label>التصنيف</label><input id="c" value="${esc(x.category||'متنوع')}"><label>المقدمة</label><textarea id="e">${esc(x.excerpt||'')}</textarea><label>نص المقال</label><textarea id="body">${esc(x.body||'')}</textarea><label>الصورة</label><input id="file" type="file" accept="image/*"><img id="prev" class="preview" ${x.image?`src="${esc(x.image)}" style="display:block"`:''}><label><input id="feat" type="checkbox" ${x.featured?'checked':''}> مقال مميز</label><button onclick="saveA(${i},this)">حفظ</button><button class="danger" onclick="this.parentElement.remove()">إلغاء</button>`);b.querySelector('#file').onchange=()=>preview(b,'file','prev')}
function editB(i){let x=D.books[i],b=box(`<h2>تعديل الكتاب</h2><label>العنوان</label><input id="t" value="${esc(x.title)}"><label>المؤلف</label><input id="a" value="${esc(x.author||'')}"><label>الوصف</label><textarea id="d">${esc(x.description||'')}</textarea><label>PDF</label><input id="pdf" type="file" accept="application/pdf,.pdf"><label>رابط خارجي</label><input id="url" value="${esc(x.url||'')}"><label>الغلاف</label><input id="cover" type="file" accept="image/*"><img id="prev" class="preview" ${x.image?`src="${esc(x.image)}" style="display:block"`:''}><button onclick="saveB(${i},this)">حفظ</button><button class="danger" onclick="this.parentElement.remove()">إلغاء</button>`);b.querySelector('#cover').onchange=()=>preview(b,'cover','prev')}
async function saveA(i,btn){try{btn.disabled=true;let x=D.articles[i],b=btn.parentElement;x.title=b.querySelector('#t').value;x.category=b.querySelector('#c').value.trim()||'متنوع';x.excerpt=b.querySelector('#e').value;x.body=b.querySelector('#body').value;x.featured=b.querySelector('#feat').checked;let f=b.querySelector('#file').files[0];if(f)x.image=await upload(f,'articles/'+x.id,4);D.articles.forEach((a,j)=>{if(x.featured&&j!==i)a.featured=false});b.remove();render()}catch(e){alert(e.message);btn.disabled=false}}
async function saveB(i,btn){try{btn.disabled=true;let x=D.books[i],b=btn.parentElement;x.title=b.querySelector('#t').value;x.author=b.querySelector('#a').value;x.description=b.querySelector('#d').value;let p=b.querySelector('#pdf').files[0],f=b.querySelector('#cover').files[0];if(f)x.image=await upload(f,'books/'+x.id+'/cover',4);if(p){if(p.type!=='application/pdf')throw Error('اختر PDF فقط');x.url=await upload(p,'books/'+x.id+'/files',10)}else{x.url=b.querySelector('#url').value.trim()||x.url}b.remove();render()}catch(e){alert(e.message);btn.disabled=false}}
function feature(i){D.articles.forEach((a,j)=>a.featured=j===i?!a.featured:false);render()}function delA(i){if(confirm('حذف المقال؟')){D.articles.splice(i,1);render()}}function delB(i){if(confirm('حذف الكتاب؟')){D.books.splice(i,1);render()}}
function saveSettings(){D.site.tagline=tagline.value;D.site.description=sitedesc.value;alert('تم حفظ الإعدادات. اضغط نشر لإظهارها على الموقع.')}
async function publish(){try{pub.textContent='جاري النشر...';let r=await gh('PUT',api(),{message:'Update Ali Adeeb content',content:enc(JSON.stringify(D,null,2)),sha:SHA});SHA=r.content.sha;pub.textContent='تم النشر بنجاح.';pub.className='status ok'}catch(e){pub.textContent='فشل النشر: '+e.message;pub.className='status warn'}}
</script></body></html>
