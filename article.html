<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow"><meta id="metaDesc" name="description" content="مقال من Ali Adeeb">
<meta property="og:type" content="article"><meta id="ogTitle" property="og:title" content="Ali Adeeb">
<meta id="ogDesc" property="og:description" content="مقال من Ali Adeeb"><meta id="ogImage" property="og:image" content="">
<meta name="twitter:card" content="summary_large_image"><meta id="twTitle" name="twitter:title" content="Ali Adeeb"><meta id="twDesc" name="twitter:description" content="مقال من Ali Adeeb">
<title>Ali Adeeb | مقال</title>
<style>
body{margin:0;background:#f7f5f0;color:#17211e;font-family:Arial,Tahoma,sans-serif;line-height:2}.wrap{max-width:820px;width:92%;margin:auto;padding:35px 0 70px}a{color:#a06d36}.back{display:inline-block;margin-bottom:25px}.tag{color:#a06d36;font-weight:bold;font-size:13px}.date,.readtime{color:#777;font-size:12px;margin-right:10px}.cover{width:100%;max-height:430px;object-fit:cover;border-radius:18px;margin:20px 0}.placeholder{width:100%;height:220px;display:flex;align-items:center;justify-content:center;font:800 34px Georgia,serif;color:#fff;border-radius:18px;margin:20px 0}h1{font:42px/1.35 Georgia,serif;margin:10px 0 18px}.body{font-size:18px;background:white;border:1px solid #e5ded3;border-radius:18px;padding:30px}
.top{display:flex;justify-content:space-between;align-items:center}.likebtn{border:0;background:none;cursor:pointer;font-size:26px;line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.tagpill{background:#eee9e1;color:#a06d36;font-size:12px;padding:3px 11px;border-radius:20px;border:0}
.share{margin:25px 0;display:flex;gap:8px;flex-wrap:wrap}.share a,.share button{padding:8px 13px;border-radius:9px;background:#17211e;color:white;text-decoration:none;font-size:13px;border:0;cursor:pointer;font-family:inherit}.share button.alt{background:#eee9e1;color:#17211e}
.related{margin-top:30px;padding-top:20px;border-top:1px solid #e5ded3}.related h3{font-size:18px;margin-bottom:12px}.relgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.relcard{background:#eee9e1;border-radius:12px;padding:12px;display:block}.relcard b{display:block;font-size:14px;margin-bottom:3px;color:#17211e}.relcard span{font-size:11px;color:#777}
.quotebtn{position:fixed;display:none;background:#17211e;color:#f7f5f0;border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;z-index:60;font-family:inherit}
@media(max-width:700px){.relgrid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<a class="back" href="index.html">← العودة إلى Ali Adeeb</a><article>
<div class="top"><div><div id="tag" class="tag"></div><span id="date" class="date"></span><span id="readtime" class="readtime"></span></div><button id="likeBtn" class="likebtn" onclick="toggleLike()">🤍</button></div>
<h1 id="title">جاري تحميل المقال...</h1><div id="tagsWrap" class="tags"></div><div id="coverWrap"></div><div id="body" class="body"></div>
<div class="share" id="shareWrap"><a id="wa" target="_blank">واتساب</a><a id="tg" target="_blank">تيليجرام</a><a id="fb" target="_blank">فيسبوك</a><a id="tw" target="_blank">X</a><button class="alt" onclick="copyLink(this)">نسخ الرابط</button></div>
<div id="relatedWrap"></div>
</article></main>
<button id="quoteBtn" class="quotebtn" onclick="copyQuote()">❝ نسخ كاقتباس</button>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let id=new URLSearchParams(location.search).get('id');
function isLiked(){return localStorage.getItem('like_'+id)==='1'}
function toggleLike(){let on=isLiked();localStorage.setItem('like_'+id,on?'0':'1');likeBtn.textContent=on?'🤍':'❤️'}
function copyLink(btn){navigator.clipboard.writeText(location.href);btn.textContent='تم النسخ ✓'}
const PH_COLORS=['#8a5a34','#2f5546','#4a4e8f','#7a3b46','#3a6b6b','#8a7a2f'];
function phColor(cat){let s=cat||'عام',h=0;for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return PH_COLORS[Math.abs(h)%PH_COLORS.length]}

let selText='';
document.addEventListener('mouseup',showQuoteBtn);document.addEventListener('touchend',showQuoteBtn);
function showQuoteBtn(e){let s=window.getSelection(),t=s.toString().trim();if(t.length>3&&document.getElementById('body').contains(s.anchorNode)){selText=t;let r=s.getRangeAt(0).getBoundingClientRect();quoteBtn.style.top=(r.top-42+window.scrollY)+'px';quoteBtn.style.left=Math.max(8,r.left)+'px';quoteBtn.style.display='block'}else if(!e.target.closest('#quoteBtn')){quoteBtn.style.display='none'}}
function copyQuote(){if(!selText)return;navigator.clipboard.writeText(`"${selText}"\n— ${title.textContent}, Ali Adeeb`);quoteBtn.textContent='تم النسخ ✓';setTimeout(()=>{quoteBtn.textContent='❝ نسخ كاقتباس';quoteBtn.style.display='none'},1200)}

fetch('content.json?'+Date.now()).then(r=>r.json()).then(d=>{
let all=d.articles||[],x=all.find(a=>a.id===id);
if(!x){document.title='Ali Adeeb | المقال غير موجود';title.textContent='المقال غير موجود';body.textContent='تعذر العثور على المقال.';shareWrap.style.display='none';return}
document.title=(x.title||'مقال')+' | Ali Adeeb';
title.textContent=x.title||'';tag.textContent=x.category||'متنوع';date.textContent=x.date||'';
let words=(x.body||'').trim().split(/\s+/).filter(Boolean).length,mins=Math.max(1,Math.round(words/200));readtime.textContent='~ '+mins+' '+(mins===1?'دقيقة':'دقائق')+' قراءة';
likeBtn.textContent=isLiked()?'❤️':'🤍';
tagsWrap.innerHTML=(x.tags||[]).map(t=>`<span class="tagpill">#${esc(t)}</span>`).join('');
body.innerHTML=esc(x.body||'').replace(/\n/g,'<br>');
if(x.image){coverWrap.innerHTML=`<img class="cover" src="${esc(x.image)}" alt="${esc(x.title)}">`;ogImage.content=x.image}else{coverWrap.innerHTML=`<div class="placeholder" style="background:${phColor(x.category)}">${esc((x.category||'عام').trim().slice(0,2))}</div>`}
metaDesc.content=x.excerpt||x.title;ogTitle.content=x.title;ogDesc.content=x.excerpt||'';twTitle.content=x.title;twDesc.content=x.excerpt||'';
let u=encodeURIComponent(location.href);wa.href='https://wa.me/?text='+encodeURIComponent(x.title+' '+location.href);tg.href='https://t.me/share/url?url='+u+'&text='+encodeURIComponent(x.title);fb.href='https://www.facebook.com/sharer/sharer.php?u='+u;tw.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(x.title)+'&url='+u;
let rel=all.filter(a=>a.id!==x.id&&((a.category&&a.category===x.category)||(a.tags||[]).some(t=>(x.tags||[]).includes(t)))).slice(0,4);
if(rel.length)relatedWrap.innerHTML=`<div class="related"><h3>مقالات ذات صلة</h3><div class="relgrid">${rel.map(a=>`<a class="relcard" href="article.html?id=${encodeURIComponent(a.id)}"><b>${esc(a.title)}</b><span>${esc(a.category||'')}</span></a>`).join('')}</div></div>`;
}).catch(()=>{title.textContent='تعذر تحميل المقال';body.textContent='تحقق من اتصال الموقع.'});
</script></body></html>
