<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المقال — Ali Adeeb</title>
<meta id="metaDescription" name="description" content="مقال من Ali Adeeb">
<meta name="robots" content="index,follow,max-image-preview:large">
<link id="canonical" rel="canonical" href="https://3li3deeb.github.io/Ali-Adeeb/article.html">
<meta property="og:site_name" content="Ali Adeeb">
<meta id="ogTitle" property="og:title" content="Ali Adeeb">
<meta id="ogDescription" property="og:description" content="مقال من Ali Adeeb">
<meta id="ogUrl" property="og:url" content="https://3li3deeb.github.io/Ali-Adeeb/article.html">
<meta property="og:type" content="article">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="site-manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#17211e;font-family:"Amiri",Tahoma,Arial,sans-serif;line-height:2;font-size:19px}
main{max-width:850px;width:92%;margin:auto;padding:28px 0 70px}
.back{display:inline-block;margin-bottom:25px;color:#9a6b35;text-decoration:none;font-weight:700}
article{background:#fff;border:1px solid #e3ddd2;border-radius:22px;padding:28px 30px;box-shadow:0 8px 30px #17211e0b}
.tag{color:#9a6b35;font-weight:700;font-size:15px}.date{color:#68716c;font-size:14px}
h1{font-size:38px;line-height:1.35;margin:10px 0 18px;font-weight:700}
.excerpt{color:#68716c;font-size:20px}
.body{margin-top:28px;white-space:normal}
.body p{margin:0 0 20px}
.cover{display:block;width:100%;max-height:520px;object-fit:cover;border-radius:16px;margin:20px 0}
@media(max-width:650px){article{padding:22px 18px}h1{font-size:30px}}
</style>
</head>
<body>
<main>
<a class="back" href="./">← العودة إلى الموقع</a>
<article id="article"><p>جاري تحميل المقال...</p></article>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const id=new URLSearchParams(location.search).get('id');
function paragraphs(s){return String(s??'').split(/\n\s*\n|\n/).filter(Boolean).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}
fetch('content.json?'+Date.now()).then(r=>r.json()).then(D=>{
 const x=(D.articles||[]).find(a=>a.id===id);
 if(!x){document.title='المقال غير موجود — Ali Adeeb';article.innerHTML='<h1>المقال غير موجود</h1><p>تعذر العثور على المقال المطلوب.</p>';return}
 const base='https://3li3deeb.github.io/Ali-Adeeb/article.html?id='+encodeURIComponent(x.id);
 document.title=(x.seoTitle||x.title||'مقال')+' — Ali Adeeb';
 metaDescription.content=x.seoDescription||x.excerpt||x.title||'مقال من Ali Adeeb';
 canonical.href=base; ogTitle.content=x.title||'Ali Adeeb'; ogDescription.content=x.excerpt||''; ogUrl.content=base;
 article.innerHTML=`<div class="tag">${esc(x.category||'متنوع')}</div><h1>${esc(x.title||'مقال')}</h1><div class="date">${esc(x.date||'')}</div>${x.image?`<img class="cover" src="${esc(x.image)}" alt="${esc(x.title||'')}">`:''}<p class="excerpt">${esc(x.excerpt||'')}</p><div class="body">${paragraphs(x.body)}</div>`;
 const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify({
   "@context":"https://schema.org","@type":"Article","headline":x.seoTitle||x.title||"مقال","description":x.seoDescription||x.excerpt||"",
   "datePublished":x.date||undefined,"inLanguage":"ar","mainEntityOfPage":base,
   "author":{"@type":"Person","name":"Ali Adeeb"}
 });document.head.appendChild(ld);
}).catch(()=>article.innerHTML='<h1>تعذر تحميل المقال</h1><p>حاول تحديث الصفحة.</p>');
</script>
</body></html>
