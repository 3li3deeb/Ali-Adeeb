<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow"><meta id="metaDesc" name="description" content="مقال من Ali Adeeb">
<meta property="og:type" content="article"><meta id="ogTitle" property="og:title" content="Ali Adeeb">
<meta id="ogDesc" property="og:description" content="مقال من Ali Adeeb"><meta id="ogImage" property="og:image" content="">
<meta name="twitter:card" content="summary_large_image"><meta id="twTitle" name="twitter:title" content="Ali Adeeb"><meta id="twDesc" name="twitter:description" content="مقال من Ali Adeeb">
<title>Ali Adeeb | مقال</title>
<style>
body{margin:0;background:#f7f5f0;color:#17211e;font-family:Arial,Tahoma,sans-serif;line-height:2}.wrap{max-width:820px;width:92%;margin:auto;padding:35px 0 70px}a{color:#a06d36}.back{display:inline-block;margin-bottom:25px}.tag{color:#a06d36;font-weight:bold;font-size:13px}.date{color:#777;font-size:12px;margin-right:10px}.cover{width:100%;max-height:430px;object-fit:cover;border-radius:18px;margin:20px 0}h1{font:42px/1.35 Georgia,serif;margin:10px 0 18px}.body{font-size:18px;background:white;border:1px solid #e5ded3;border-radius:18px;padding:30px}
.top{display:flex;justify-content:space-between;align-items:center}.likebtn{border:0;background:none;cursor:pointer;font-size:26px;line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.tagpill{background:#eee9e1;color:#a06d36;font-size:12px;padding:3px 11px;border-radius:20px;border:0}
.share{margin:25px 0;display:flex;gap:8px;flex-wrap:wrap}.share a,.share button{padding:8px 13px;border-radius:9px;background:#17211e;color:white;text-decoration:none;font-size:13px;border:0;cursor:pointer;font-family:inherit}.share button.alt{background:#eee9e1;color:#17211e}
</style></head><body><main class="wrap">
<a class="back" href="index.html">← العودة إلى Ali Adeeb</a><article>
<div class="top"><div><div id="tag" class="tag"></div><div id="date" class="date"></div></div><button id="likeBtn" class="likebtn" onclick="toggleLike()">🤍</button></div>
<h1 id="title">جاري تحميل المقال...</h1><div id="tagsWrap" class="tags"></div><img id="cover" class="cover" style="display:none"><div id="body" class="body"></div>
<div class="share" id="shareWrap"><a id="wa" target="_blank">واتساب</a><a id="tg" target="_blank">تيليجرام</a><a id="fb" target="_blank">فيسبوك</a><a id="tw" target="_blank">X</a><button class="alt" onclick="copyLink(this)">نسخ الرابط</button></div>
</article></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let id=new URLSearchParams(location.search).get('id');
function isLiked(){return localStorage.getItem('like_'+id)==='1'}
function toggleLike(){let on=isLiked();localStorage.setItem('like_'+id,on?'0':'1');likeBtn.textContent=on?'🤍':'❤️'}
function copyLink(btn){navigator.clipboard.writeText(location.href);btn.textContent='تم النسخ ✓'}
fetch('content.json?'+Date.now()).then(r=>r.json()).then(d=>{
let x=(d.articles||[]).find(a=>a.id===id);
if(!x){document.title='Ali Adeeb | المقال غير موجود';title.textContent='المقال غير موجود';body.textContent='تعذر العثور على المقال.';shareWrap.style.display='none';return}
document.title=(x.title||'مقال')+' | Ali Adeeb';
title.textContent=x.title||'';tag.textContent=x.category||'متنوع';date.textContent=x.date||'';
likeBtn.textContent=isLiked()?'❤️':'🤍';
tagsWrap.innerHTML=(x.tags||[]).map(t=>`<span class="tagpill">#${esc(t)}</span>`).join('');
body.innerHTML=esc(x.body||'').replace(/\n/g,'<br>');
if(x.image){cover.src=x.image;cover.alt=x.title;cover.style.display='block';ogImage.content=x.image}
metaDesc.content=x.excerpt||x.title;ogTitle.content=x.title;ogDesc.content=x.excerpt||'';twTitle.content=x.title;twDesc.content=x.excerpt||'';
let u=encodeURIComponent(location.href);wa.href='https://wa.me/?text='+encodeURIComponent(x.title+' '+location.href);tg.href='https://t.me/share/url?url='+u+'&text='+encodeURIComponent(x.title);fb.href='https://www.facebook.com/sharer/sharer.php?u='+u;tw.href='https://twitter.com/intent/tweet?text='+encodeURIComponent(x.title)+'&url='+u;
}).catch(()=>{title.textContent='تعذر تحميل المقال';body.textContent='تحقق من اتصال الموقع.'});
</script></body></html>
