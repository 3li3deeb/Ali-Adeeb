<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al-Adeeb</title>
<meta name="description" content="Al-Adeeb — مساحة للقراءة والفكرة، مقالات وكتب.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="site-manifest.json">
<style>
:root{--bg:#f7f5f0;--card:#fff;--text:#18201d;--muted:#69716d;--accent:#9a6b35;--line:#e7e0d5;--dark:#17211e}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"Amiri",Tahoma,Arial,sans-serif;font-size:17px;line-height:2}a{text-decoration:none;color:inherit}
nav{position:sticky;top:0;z-index:5;background:#f7f5f0ee;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.nav{max-width:1120px;width:92%;margin:auto;height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700;font-size:25px;direction:ltr}.brand span{color:var(--accent)}.links{display:flex;gap:24px;color:#4f5954;font-weight:700}.links a:hover{color:var(--accent)}
.hero{max-width:1120px;width:92%;margin:auto;padding:75px 0 60px;display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:center}.kicker,.tag{color:var(--accent);font-weight:700}h1{font-family:Georgia,serif;font-size:clamp(50px,7vw,82px);line-height:1;margin:12px 0 20px;direction:ltr;text-align:right}.hero p{font-size:19px;color:var(--muted)}.btn{display:inline-block;padding:11px 21px;border-radius:10px;border:1px solid var(--line);font-weight:700;margin:10px 6px 0 0}.primary{background:var(--dark);color:white}
.visual{min-height:340px;border-radius:26px;background:linear-gradient(145deg,#18231f,#34443c);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px}.visual img{display:block;width:100%;height:100%;max-height:300px;object-fit:contain;border-radius:18px}
section{max-width:1120px;width:92%;margin:auto;padding:55px 0}.head{margin-bottom:22px}.head h2{margin:0;font-size:30px}.head p{color:var(--muted)}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-bottom:20px;background:#fff;color:var(--text);outline:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:24px;overflow:hidden}.card-image{display:block;width:100%;height:210px;object-fit:cover;border-radius:13px;margin:-4px 0 18px;border:1px solid var(--line);background:#f1eee8}.card h3{margin:8px 0;font-size:22px}.card p{color:var(--muted);font-size:15px}.read{display:inline-block;margin-top:15px;color:var(--accent);font-weight:700}.read:hover{text-decoration:underline}
.about{background:var(--dark);color:#eef0ed;border-radius:25px;padding:45px}.about p{color:#bfc8c3}footer{padding:32px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:800px){.links{display:none}.hero{grid-template-columns:1fr;padding-top:50px}.visual{min-height:240px}.visual img{max-height:210px}.grid{grid-template-columns:1fr}}
</style></head><body>
<nav><div class="nav"><a class="brand" href="#">Al-<span>Adeeb</span></a><div class="links"><a href="#articles">المقالات</a><a href="#books">الكتب</a><a href="#about">عن الموقع</a></div></div></nav>
<section class="hero"><div><div class="kicker" id="tagline">مساحة للقراءة والفكرة</div><h1>Al-Adeeb</h1><p id="desc"></p><a class="btn primary" href="#articles">استكشف المقالات</a><a class="btn" href="#books">تصفح الكتب</a></div><div class="visual"><img src="logo.png" alt="Al-Adeeb"></div></section>
<section id="articles"><div class="head"><h2>أحدث المقالات</h2><p>أفكار وقراءات متنوعة.</p></div><input id="search" class="search" placeholder="ابحث في المقالات والكتب..." autocomplete="off"><div id="articlesGrid" class="grid"></div></section>
<section id="books"><div class="head"><h2>الكتب</h2><p>مكتبة قابلة للتوسع.</p></div><div id="booksGrid" class="grid"></div></section>
<section id="about"><div class="about"><div class="kicker">عن الموقع</div><h2 id="aboutTitle">أهلاً بك في Al-Adeeb</h2><p id="aboutText">مساحة شخصية للنشر والمعرفة.</p></div></section>
<footer>© 2026 Al-Adeeb — جميع الحقوق محفوظة</footer>
<script>
let D={site:{},articles:[],books:[]};const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
 let q=$('search').value.toLowerCase().trim();
 $('articlesGrid').innerHTML=D.articles.filter(x=>((x.title||'')+' '+(x.category||'')+' '+(x.excerpt||'')+' '+(x.body||'')).toLowerCase().includes(q)).map(x=>{
  const url='article.html?id='+encodeURIComponent(x.id);
  return `<article class="card" id="article-card-${esc(x.id)}">${x.image?`<img class="card-image" src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy">`:''}<div class="tag">${esc(x.category||'متنوع')}</div><h3>${esc(x.title||'')}</h3><p>${esc(x.excerpt||'')}</p><a class="read" href="${url}">قراءة المقال ←</a></article>`
 }).join('')||'<p>لا توجد نتائج.</p>';
 $('booksGrid').innerHTML=D.books.map(x=>`<article class="card" id="book-card-${esc(x.id||x.title)}">${x.image?`<img class="card-image" src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy">`:''}<div class="tag">كتاب</div><h3>${esc(x.title||'')}</h3><p>${esc(x.description||'')}</p><a class="read" href="book.html?id=${encodeURIComponent(x.id||x.title)}">فتح الكتاب ←</a></article>`).join('')||'<p>لا توجد كتب بعد.</p>';
}
$('search').oninput=render;
fetch('content.json?'+Date.now()).then(r=>r.json()).then(x=>{D=x;D.site=D.site||{};$('desc').textContent=D.site.description||'';$('tagline').textContent=D.site.tagline||'مساحة للقراءة والفكرة';$('aboutTitle').textContent='أهلاً بك في '+(D.site.name||'Al-Adeeb');$('aboutText').textContent=D.site.description||'';render();
 const target=new URLSearchParams(location.search).get('return');
 if(target){setTimeout(()=>document.getElementById(target)?.scrollIntoView({behavior:'smooth',block:'center'}),250)}
}).catch(()=>{$('desc').textContent='تعذر تحميل المحتوى حالياً.'});
</script></body></html>
