   BASE / COLORS
===================================================== */

/* =====================================================
   NAVIGATION
===================================================== */

nav{

top:0;
z-index:50;
background:#f7f5f0ee;
border-bottom:1px solid var(--line);
backdrop-filter:blur(10px)
}

.nav{

width:92%;

height:72px;

align-items:center;

.brand{

}

}

.links a{

}

}


/* =====================================================
   HERO
===================================================== */

.hero{
max-width:1120px;
width:92%;
margin:auto;
padding:75px 0 60px;

grid-template-columns:1.2fr .8fr;
gap:50px;

}

.kicker{

font-weight:700;
font-size:16px
}

h1{

line-height:1;
margin:12px 0 20px;
direction:ltr;
text-align:right
}

.hero p{
font-size:19px;
color:var(--muted);
margin:0 0 8px
}

.btn{
display:inline-block;
padding:11px 21px;
border-radius:10px;
border:1px solid var(--line);
font-weight:700;
font-size:15px;
margin:10px 6px 0 0;
transition:all .2s ease
}

.btn:hover{
transform:translateY(-1px);
box-shadow:0 4px 15px rgba(0,0,0,.05)
}

.primary{
background:var(--dark);
color:white
}


/* =====================================================
   LOGO
===================================================== */

.visual{
min-height:340px;
border-radius:26px;
background:linear-gradient(145deg,#18231f,#34443c);

align-items:center;
justify-content:center;
overflow:hidden;
padding:20px;

}

.visual img{
display:block;
width:100%;
height:100%;
max-width:100%;
max-height:300px;
object-fit:contain;
border-radius:18px
}


/* =====================================================
   SECTIONS
===================================================== */

section{
max-width:1120px;
width:92%;
margin:auto;
padding:55px 0
}

.head{
margin-bottom:22px
}

.head h2{
margin:0;
font-size:30px
}

.head p{
color:var(--muted);
font-size:16px;
margin:4px 0 0

/* =====================================================
   SEARCH
===================================================== */

.search-wrap{
position:relative;
margin-bottom:24px
}

.search{
width:100%;
padding:14px 17px;
border:1px solid var(--line);
border-radius:13px;
font:inherit;
background:#fff;
color:var(--text);
outline:none;
transition:border-color .2s ease,box-shadow .2s ease
}

.search:focus{
border-color:var(--accent);
box-shadow:0 0 0 3px rgba(154,107,53,.08)
}

.search::placeholder{
color:#8a918d
}


/* =====================================================
   GRID
===================================================== */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}


/* =====================================================
   CARDS
===================================================== */

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:20px;
overflow:hidden;
box-shadow:0 2px 8px rgba(23,33,30,.025);
transition:transform .22s ease,box-shadow .22s ease
}

}

.card .card-image{
display:block;
width:calc(100% + 40px);
height:210px;
object-fit:cover;
border-radius:13px;
margin:-20px -20px 18px;
border:1px solid var(--line);
background:var(--soft)
}

.tag{

font-size:14px;
font-weight:700
}

.card h3{
margin:7px 0;
font-size:22px;
line-height:1.7
}

color:var(--muted);
font-size:15px;
margin:5px 0
}


/* =====================================================
   READING META
===================================================== */

.article-meta{
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
margin-top:8px;
font-size:12px;
color:var(--muted)
}

.article-meta span{
display:inline-flex;
align-items:center;
gap:3px
}

.meta-dot{
width:4px;
height:4px;
background:#aaa;
border-radius:50%;
display:inline-block
}


/* =====================================================
   READ BUTTON
===================================================== */

.read{
display:inline-flex;
align-items:center;
gap:5px;
margin-top:15px;
color:var(--accent);
font-weight:700;
font-size:15px;
transition:gap .2s ease
}

.read:hover{
gap:9px;
text-decoration:none
}


/* =====================================================
   INTERACTIONS
===================================================== */

.interactions{
display:flex;
align-items:center;
gap:8px;
margin-top:18px;
padding-top:14px;
border-top:1px solid var(--line);

}

.interaction-btn{
border:1px solid var(--line);
background:#fff;
color:var(--text);
border-radius:9px;
padding:8px 12px;
font-family:inherit;
font-size:14px;
cursor:pointer;
transition:all .2s ease
}

.interaction-btn:hover{
background:#f7f5f0;
transform:translateY(-1px)
}

.interaction-btn:active{
transform:translateY(0)
}

.interaction-btn.liked{
background:#f7eee5;
color:var(--accent);
border-color:#d8c1a5
}


/* =====================================================
   COMMENTS
===================================================== */

.comment-box{
display:none;
width:100%;
margin-top:10px
}

.comment-box.show{
display:block
}

.comment-input{
width:100%;
min-height:80px;
resize:vertical;
border:1px solid var(--line);
border-radius:10px;
padding:10px;

background:#fff;

}

.comment-input:focus{

}

.comment-submit{
margin-top:7px;
border:0;
background:var(--dark);
color:#fff;
border-radius:9px;
padding:8px 14px;

}

.comment-submit:hover{
opacity:.9
}

.comments-list{
margin-top:12px;
width:100%
}

.comment-item{
background:#f7f5f0;

padding:9px 12px;
margin-top:7px;
font-size:13px;

.comment-date{
display:block;
font-size:10px;
color:var(--muted);
margin-top:3px
}


/* =====================================================
   ABOUT
===================================================== */

.about{

color:#eef0ed;
border-radius:25px;
padding:45px

.about p{
color:#bfc8c3

/* =====================================================
   MODAL / READING VIEW
===================================================== */

.modal{

inset:0;
background:rgba(0,0,0,.55);
display:none;
align-items:center;
justify-content:center;
padding:20px;

.modal.show{

}

.dialog{

max-width:800px;
width:100%;
max-height:90vh;
overflow:auto;
border-radius:20px;
padding:32px;
color:var(--text);
box-shadow:0 20px 70px rgba(0,0,0,.2)
}

.dialog h2{
font-size:30px;
line-height:1.5;
margin:8px 0 12px
}

.dialog p{
font-size:18px;
line-height:2.25;
color:#303936
}

.dialog-image{
display:block;
width:100%;
max-height:420px;
object-fit:cover;
border-radius:15px;
margin:15px 0 25px
}

.close{
float:left;
border:0;
background:none;
font-size:28px;
cursor:pointer;
color:var(--muted)
}

.close:hover{

}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty{
grid-column:1/-1;
background:#fff;
border:1px dashed var(--line);
border-radius:15px;
padding:30px;
text-align:center;

}


/* =====================================================
   FOOTER
===================================================== */

footer{
padding:32px;
text-align:center;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

.links{

}

.hero{
grid-template-columns:1fr;
padding-top:50px;
gap:35px
}

.visual{

padding:15px
}

.visual img{
max-height:210px
}

.grid{

}

.card .card-image{

}

}

}

html,
body,

<script>

/* =====================================================
   DATA
===================================================== */

let D={
site:{},
articles:[],
books:[]
};


/* =====================================================
   SAFE TEXT
===================================================== */

function esc(s){

return String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}


/* =====================================================
   SAFE ID
===================================================== */

function safeKey(value){

return String(value)
.replace(/[^a-zA-Z0-9_-]/g,'_');

}


/* =====================================================
   LIKE SYSTEM
===================================================== */

function getLikeCount(id,type){

let key=
'al-adeeb-like-count-'+type+'-'+id;

return parseInt(
localStorage.getItem(key)||'0'
);

}


function isLiked(id,type){

let key=
'al-adeeb-liked-'+type+'-'+id;

return localStorage.getItem(key)==='1';

}


/* =====================================================
   COMMENTS
===================================================== */

function getComments(id,type){

let key=
'al-adeeb-comments-'+type+'-'+id;

try{

return JSON.parse(
localStorage.getItem(key)||'[]'
);

}catch(e){

return [];

}

}


function loadComments(id,type){

let sid=safeKey(id);

let list=
document.getElementById(
'list-'+type+'-'+sid
);

if(!list)return;

let comments=
getComments(id,type);

if(!comments.length){

list.innerHTML='';

return;

}

list.innerHTML=
comments.map(c=>`

<div class="comment-item">

${esc(c.text)}

<span class="comment-date">
${esc(c.date)}
</span>

</div>

`).join('');

}


function toggleComments(id,type){

let sid=safeKey(id);

let box=
document.getElementById(
'comments-'+type+'-'+sid
);

if(!box)return;

box.classList.toggle('show');

if(box.classList.contains('show')){

loadComments(id,type);

}

}


function addComment(id,type){

let sid=safeKey(id);

let input=
document.getElementById(
'input-'+type+'-'+sid
);

if(!input)return;

let text=
input.value.trim();

if(!text){

alert('اكتب تعليقك أولاً');

return;

}

let comments=
getComments(id,type);

comments.push({

text:text,

date:new Date().toLocaleString('ar-IQ')

});

let key=
'al-adeeb-comments-'+type+'-'+id;

localStorage.setItem(
key,
JSON.stringify(comments)
);

input.value='';

loadComments(id,type);

}


/* =====================================================
   LIKE
===================================================== */

function toggleLike(id,type){

let sid=safeKey(id);

let keyLiked=
'al-adeeb-liked-'+type+'-'+id;

let keyCount=
'al-adeeb-like-count-'+type+'-'+id;

let liked=
localStorage.getItem(keyLiked)==='1';

let count=
parseInt(
localStorage.getItem(keyCount)||'0'
);

let button=
document.getElementById(
'like-'+type+'-'+sid
);

if(liked){

localStorage.removeItem(keyLiked);

count=Math.max(
0,
count-1
);

if(button){

button.classList.remove('liked');

button.innerHTML=
'♡ إعجاب <span id="count-'+type+'-'+sid+'">'+
count+
'</span>';

}

}else{

localStorage.setItem(
keyLiked,
'1'
);

count++;

if(button){

button.classList.add('liked');

button.innerHTML=
'♥ أعجبني <span id="count-'+type+'-'+sid+'">'+
count+
'</span>';

}

}

localStorage.setItem(
keyCount,
count
);

}


/* =====================================================
   SHARE
===================================================== */

function shareContent(id,type,title){

let url=
window.location.origin+
window.location.pathname;

if(type==='article'){

url+=
'?article='+
encodeURIComponent(id);

}else{

url+=
'?book='+
encodeURIComponent(id);

}

if(navigator.share){

navigator.share({

title:title||'Al-Adeeb',

text:'مشاركة من موقع Al-Adeeb',

url:url

}).catch(()=>{});

}

else if(navigator.clipboard){

navigator.clipboard
.writeText(url)
.then(()=>{

alert('تم نسخ رابط المشاركة');

})
.catch(()=>{

prompt(
'انسخ رابط المشاركة:',
url
);

});

}

else{

prompt(
'انسخ رابط المشاركة:',
url
);

}

}


/* =====================================================
   INTERACTION BUTTONS
===================================================== */

function interactionHTML(
id,
type,
title
){

let sid=
safeKey(id);

let count=
getLikeCount(id,type);

let liked=
isLiked(id,type);

let safeId=
String(id)
.replace(/\\/g,'\\\\')
.replace(/'/g,"\\'");

let safeTitle=
String(title||'Al-Adeeb')
.replace(/\\/g,'\\\\')
.replace(/'/g,"\\'");

return `

<div class="interactions">

<button
class="interaction-btn"
onclick="shareContent(
'${safeId}',
'${type}',
'${safeTitle}'
)">
↗ مشاركة
</button>


<button
class="interaction-btn ${liked?'liked':''}"
id="like-${type}-${sid}"
onclick="toggleLike(
'${safeId}',
'${type}'
)">

${liked?'♥ أعجبني':'♡ إعجاب'}

<span id="count-${type}-${sid}">
${count}
</span>

</button>


<button
class="interaction-btn"
onclick="toggleComments(
'${safeId}',
'${type}'
)">
💬 تعليق
</button>


<div
class="comment-box"
id="comments-${type}-${sid}"
>

<textarea
class="comment-input"
id="input-${type}-${sid}"
placeholder="اكتب تعليقك هنا..."
></textarea>


<button
class="comment-submit"
onclick="addComment(
'${safeId}',
'${type}'
)">
إضافة التعليق
</button>


<div
class="comments-list"
id="list-${type}-${sid}">
</div>

</div>

</div>

`;

}


/* =====================================================
   ESTIMATE READING TIME
===================================================== */

function readingTime(text){

let words=
String(text||'')
.trim()
.split(/\s+/)
.filter(Boolean)
.length;

let minutes=
Math.max(
1,
Math.ceil(words/180)
);

return minutes;

}


/* =====================================================
   RENDER
===================================================== */

function render(){

let q=
search.value
.toLowerCase()
.trim();


/* ARTICLES */

let filteredArticles=
D.articles.filter(x=>

(
(x.title||'')+' '+
(x.category||'')+' '+
(x.excerpt||'')+' '+
(x.body||'')
)

.toLowerCase()

.includes(q)

);


articlesGrid.innerHTML=

filteredArticles

.map(x=>`

<article class="card">


${x.image?

`
<img
class="card-image"
src="${esc(x.image)}"
alt="${esc(x.title)}"
loading="lazy"
onerror="this.style.display='none'"
>
`

:''}


<div class="tag">
${esc(x.category||'مقال')}
</div>


<h3>
${esc(x.title)}
</h3>


<p>
${esc(x.excerpt||'')}
</p>


<div class="article-meta">

<span>
📖 ${readingTime(x.body)} دقيقة قراءة
</span>

${x.date?

`
<span class="meta-dot"></span>

<span>
${esc(x.date)}
</span>
`

:''}

</div>


<a
class="read"
href="article.html?id=${encodeURIComponent(x.id)}"
>
قراءة المقال ←
</a>


${interactionHTML(
x.id,
'article',
x.title
)}


</article>

`)

.join('')


||

`
<div class="empty">
لا توجد مقالات مطابقة لبحثك.
</div>
`;


/* BOOKS */

booksGrid.innerHTML=

D.books

.map(x=>`

<article class="card">


${x.image?

`
<img
class="card-image"
src="${esc(x.image)}"
alt="${esc(x.title)}"
loading="lazy"
onerror="this.style.display='none'"
>
`

:''}


<div class="tag">
كتاب
</div>


<h3>
${esc(x.title)}
</h3>


<p>
${esc(x.description||'')}
</p>


${x.url?

`
<a

href="${esc(x.url)}"
target="_blank"
rel="noopener">
فتح الكتاب ←
</a>
`

:''}


${interactionHTML(

`)

.join('')

||

`
<div class="empty">
لا توجد كتب بعد.
</div>
`;

}


/* =====================================================
   ARTICLE READER
===================================================== */

function openA(id){

let x=
D.articles.find(
a=>String(a.id)===String(id)
);

if(!x)return;


modalBody.innerHTML=`

<div class="tag">
${esc(x.category||'مقال')}
${x.date?' · '+esc(x.date):''}
</div>


<h2>
${esc(x.title)}
</h2>


${
x.image?

`
<img
class="dialog-image"
src="${esc(x.image)}"
alt="${esc(x.title)}"
>
`

:''
}


<div class="article-meta">

<span>
📖 ${readingTime(x.body)} دقيقة قراءة
</span>

</div>


<p>
${esc(x.body||'').replace(
/\n/g,
'<br>'
)}
</p>

`;


modal.classList.add('show');

modal.setAttribute(
'aria-hidden',
'false'
);

}


function closeModal(){

modal.classList.remove('show');

modal.setAttribute(
'aria-hidden',
'true'
);

}


/* =====================================================
   CLOSE MODAL OUTSIDE
===================================================== */

modal.addEventListener(
'click',
function(e){

if(e.target===modal){

closeModal();

}

});


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
'keydown',
function(e){

if(e.key==='Escape'){

closeModal();

}

});


/* =====================================================
   SEARCH
===================================================== */

search.oninput=
render;


/* =====================================================
   LOAD CONTENT
===================================================== */

fetch(
'content.json?'+Date.now()
)

.then(r=>{

if(!r.ok){

throw new Error(
'HTTP '+r.status
);

}

return r.json();

})

.then(x=>{

D=x;


/* SITE */

desc.textContent=
x.site?.description||'';


tagline.textContent=
x.site?.tagline||
'مساحة للقراءة والفكرة';


aboutTitle.textContent=
'أهلاً بك في '+
(x.site?.name||'Al-Adeeb');


aboutText.textContent=
x.site?.description||'';


/* RENDER */

render();

})


.catch(e=>{

console.error(
'content.json error:',
e
);

desc.textContent=
'تعذر تحميل المحتوى حالياً.';

});

</script>

</body>
</html>
