n-top:15px;color:var(--accent);font-weight:800}.about{background:var(--dark);color:#eef0ed;border-radius:25px;padding:45px}.about p{color:#bfc8c3}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{background:white;max-width:760px;width:100%;max-height:90vh;overflow:auto;border-radius:18px;padding:30px}.close{float:left;border:0;background:none;font-size:25px}footer{padding:32px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:800px){.links{display:none}.hero{grid-template-columns:1fr}.visual{min-height:240px}.grid{grid-template-columns:1fr}}</style>

<nav><div class="nav"><a class="brand" href="#">Al- <span>Adeeb</span></a><div class="links"><a href="#articles">المقالات</a><a href="#books">الكتب</a><a href="#about">عن الموقع</a></div></div></nav>
<section class="hero"><div><div class="kicker" id="tagline">مساحة للقراءة والفكرة</div><h1>Ali Adeeb</h1><p id="desc"></p><a class="btn primary" href="#articles">استكشف المقالات</a><a class="btn" href="#books">تصفح الكتب</a></div><div class="visual"><div class="monogram">AA</div></div></section>
<section id="articles"><div class="head"><h2>أحدث المقالات</h2><p>أفكار وقراءات متنوعة.</p></div><input id="search" class="search" placeholder="ابحث في المقالات والكتب..."><div id="articlesGrid" class="grid"></div></section>
<section id="books"><div class="head"><h2>الكتب</h2><p>مكتبة قابلة للتوسع.</p></div><div id="booksGrid" class="grid"></div></section>
<section id="about"><div class="about"><div class="kicker">عن الموقع</div><h2 id="aboutTitle">أهلاً بك في Ali Adeeb</h2><p id="aboutText">مساحة شخصية للنشر والمعرفة.</p></div></section><footer>© 2026 Ali Adeeb — جميع الحقوق محفوظة</footer>
<div id="modal" class="modal"><div class="dialog"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>let D={site:{},articles:[],books:[]},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){
let q=search.value.toLowerCase();
articlesGrid.innerHTML=D.articles.filter(x=>(x.title+' '+x.category+' '+x.excerpt+' '+x.body).toLowerCase().includes(q)).map(x=>`<article class="card">
${x.image?`<img class="card-image" src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy">`:''}
<div class="tag">${esc(x.category)}</div><h3>${esc(x.title)}</h3><p>${esc(x.excerpt)}</p>
<a class="read" href="article.html?id=${encodeURIComponent(x.id)}">قراءة المقال ←</a>
</article>`).join('')||'<p>لا توجد نتائج.</p>';
booksGrid.innerHTML=D.books.map(x=>`<article class="card">
${x.image?`<img class="card-image" src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy">`:''}
<div class="tag">كتاب</div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>
${x.url?`<a class="read" href="${esc(x.url)}" target="_blank" rel="noopener">فتح الكتاب ←</a>`:''}
</article>`).join('')||'<p>لا توجد كتب بعد.</p>'
}
function openA(id){let x=D.articles.find(a=>a.id===id);if(!x)return;modalBody.innerHTML=`<div class="tag">${esc(x.category)} · ${esc(x.date||'')}</div><h2>${esc(x.title)}</h2><p>${esc(x.body).replace(/\n/g,'<br>')}</p>`;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}search.oninput=render;fetch('content.json?'+Date.now()).then(r=>r.json()).then(x=>{D=x;desc.textContent=x.site?.description||'';tagline.textContent=x.site?.tagline||'مساحة للقراءة والفكرة';aboutTitle.textContent='أهلاً بك في '+(x.site?.name||'Ali Adeeb');aboutText.textContent=x.site?.description||'';render()}).catch(()=>{desc.textContent='تعذر تحميل المحتوى حالياً.'});</script></body></html>
