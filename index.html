<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Al-Adeeb</title>

<style>
:root{
--bg:#f7f5f0;
--card:#fff;
--text:#18201d;
--muted:#69716d;
--accent:#9a6b35;
--line:#e7e0d5;
--dark:#17211e
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,Tahoma,sans-serif;
line-height:1.9
}

a{
text-decoration:none;
color:inherit
}

nav{
position:sticky;
top:0;
z-index:5;
background:#f7f5f0ee;
border-bottom:1px solid var(--line);
backdrop-filter:blur(8px)
}

.nav{
max-width:1120px;
width:92%;
margin:auto;
height:72px;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
font-weight:800;
font-size:22px;
direction:ltr
}

.brand span{
color:var(--accent)
}

.links{
display:flex;
gap:24px;
color:#4f5954;
font-size:14px
}

.hero{
max-width:1120px;
width:92%;
margin:auto;
padding:75px 0 60px;
display:grid;
grid-template-columns:1.2fr .8fr;
gap:50px;
align-items:center
}

.kicker{
color:var(--accent);
font-weight:700;
font-size:14px
}

h1{
font-family:Georgia,serif;
font-size:clamp(50px,7vw,82px);
line-height:1;
margin:12px 0 20px;
direction:ltr;
text-align:right
}

.hero p{
font-size:18px;
color:var(--muted)
}

.btn{
display:inline-block;
padding:11px 21px;
border-radius:10px;
border:1px solid var(--line);
font-weight:700;
font-size:14px;
margin:10px 6px 0 0
}

.primary{
background:var(--dark);
color:white
}

/* الصورة الرئيسية */
.visual{
min-height:340px;
border-radius:26px;
background:linear-gradient(145deg,#18231f,#34443c);
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
padding:20px
}

.visual img{
display:block;
width:100%;
height:100%;
max-width:100%;
max-height:300px;
object-fit:contain;
border-radius:18px
}

section{
max-width:1120px;
width:92%;
margin:auto;
padding:55px 0
}

.head{
margin-bottom:22px
}

.head h2{
margin:0;
font-size:28px
}

.head p{
color:var(--muted)
}

.search{
width:100%;
padding:13px;
border:1px solid var(--line);
border-radius:12px;
font:inherit;
margin-bottom:20px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px
}

.card{
background:white;
border:1px solid var(--line);
border-radius:17px;
padding:24px
}

.tag{
color:var(--accent);
font-size:12px;
font-weight:800
}

.card h3{
margin:8px 0
}

.card p{
color:var(--muted);
font-size:14px
}

.read{
display:inline-block;
margin-top:15px;
color:var(--accent);
font-weight:800
}

/* صور المقالات والكتب */
.card .card-image{
display:block;
width:100%;
height:210px;
object-fit:cover;
border-radius:13px;
margin:-4px 0 18px;
border:1px solid var(--line)
}

/* منطقة أزرار التفاعل */
.interactions{
display:flex;
align-items:center;
gap:8px;
margin-top:18px;
padding-top:14px;
border-top:1px solid var(--line);
flex-wrap:wrap
}

/* أزرار المشاركة والإعجاب والتعليق */
.interaction-btn{
border:1px solid var(--line);
background:#fff;
color:var(--text);
border-radius:9px;
padding:8px 12px;
font-family:inherit;
font-size:13px;
cursor:pointer;
transition:all .2s ease
}

.interaction-btn:hover{
background:#f7f5f0;
transform:translateY(-1px)
}

.interaction-btn:active{
transform:translateY(0)
}

/* زر الإعجاب بعد الضغط */
.interaction-btn.liked{
background:#f7eee5;
color:var(--accent);
border-color:#d8c1a5
}

/* منطقة التعليقات */
.comment-box{
display:none;
width:100%;
margin-top:10px
}

.comment-box.show{
display:block
}

.comment-input{
width:100%;
min-height:80px;
resize:vertical;
border:1px solid var(--line);
border-radius:10px;
padding:10px;
font-family:inherit;
font-size:14px;
color:var(--text);
background:#fff;
outline:none
}

.comment-input:focus{
border-color:var(--accent)
}

.comment-submit{
margin-top:7px;
border:0;
background:var(--dark);
color:#fff;
border-radius:9px;
padding:8px 14px;
font-family:inherit;
cursor:pointer
}

.comment-submit:hover{
opacity:.9
}

.comments-list{
margin-top:12px;
width:100%
}

.comment-item{
background:#f7f5f0;
border-radius:10px;
padding:9px 12px;
margin-top:7px;
font-size:13px;
word-break:break-word
}

.comment-date{
display:block;
font-size:10px;
color:var(--muted);
margin-top:3px
}

.about{
background:var(--dark);
color:#eef0ed;
border-radius:25px;
padding:45px
}

.about p{
color:#bfc8c3
}

.modal{
position:fixed;
inset:0;
background:#0008;
display:none;
align-items:center;
justify-content:center;
padding:20px
}

.modal.show{
display:flex
}

.dialog{
background:white;
max-width:760px;
width:100%;
max-height:90vh;
overflow:auto;
border-radius:18px;
padding:30px
}

.close{
float:left;
border:0;
background:none;
font-size:25px;
cursor:pointer
}

footer{
padding:32px;
text-align:center;
color:var(--muted);
border-top:1px solid var(--line)
}

@media(max-width:800px){

.links{
display:none
}

.hero{
grid-template-columns:1fr
}

.visual{
min-height:240px;
padding:15px
}

.visual img{
max-height:210px
}

.grid{
grid-template-columns:1fr
}

.card .card-image{
height:220px
}

.interactions{
gap:6px
}

.interaction-btn{
padding:7px 10px;
font-size:12px
}

}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<meta property="og:site_name" content="Al-Adeeb">
<meta property="og:type" content="website">
<meta property="og:title" content="Al-Adeeb">
<meta property="og:description" content="مساحة للقراءة والفكرة، مقالات وقراءات وكتب.">
<meta property="og:url" content="https://3li3deeb.github.io/Ali-Adeeb/">

<meta name="twitter:card" content="summary_large_image">

<style id="ali-adeeb-v15-font">

html,body,button,input,textarea,select{
font-family:"Amiri","Noto Naskh Arabic",Tahoma,Arial,sans-serif !important;
}

body{
font-size:12px !important;
line-height:2 !important
}

h1,h2,h3,h4,.brand,.kicker,.tag,.btn,.filter,.read,.bookbtn,.links,.date,.interaction-btn,.comment-submit{
font-family:"Amiri","Noto Naskh Arabic",Tahoma,Arial,sans-serif !important;
font-weight:700 !important
}

</style>

<script type="application/ld+json">
{
 "@context":"https://schema.org",
 "@type":"WebSite",
 "name":"Al-Adeeb",
 "url":"https://3li3deeb.github.io/Ali-Adeeb/",
 "inLanguage":"ar"
}
</script>

</head>

<body>

<nav>

<div class="nav">

<a class="brand" href="#">
Al-<span>Adeeb</span>
</a>

<div class="links">

<a href="#articles">
المقالات
</a>

<a href="#books">
الكتب
</a>

<a href="#about">
عن الموقع
</a>

</div>

</div>

</nav>


<section class="hero">

<div>

<div class="kicker" id="tagline">
مساحة للقراءة والفكرة
</div>

<h1>
Al-Adeeb
</h1>

<p id="desc"></p>

<a class="btn primary" href="#articles">
استكشف المقالات
</a>

<a class="btn" href="#books">
تصفح الكتب
</a>

</div>


<div class="visual">

<img
src="logo.png"
alt="Al-Adeeb">

</div>

</section>


<section id="articles">

<div class="head">

<h2>
أحدث المقالات
</h2>

<p>
أفكار وقراءات متنوعة.
</p>

</div>

<input
id="search"
class="search"
placeholder="ابحث في المقالات والكتب..."
>

<div
id="articlesGrid"
class="grid">
</div>

</section>


<section id="books">

<div class="head">

<h2>
الكتب
</h2>

<p>
مكتبة قابلة للتوسع.
</p>

</div>

<div
id="booksGrid"
class="grid">
</div>

</section>


<section id="about">

<div class="about">

<div class="kicker">
عن الموقع
</div>

<h2 id="aboutTitle">
أهلاً بك في Al-Adeeb
</h2>

<p id="aboutText">
مساحة شخصية للنشر والمعرفة.
</p>

</div>

</section>


<footer>
© 2026 Al-Adeeb — جميع الحقوق محفوظة
</footer>


<div id="modal" class="modal">

<div class="dialog">

<button
class="close"
onclick="closeModal()">
×
</button>

<div id="modalBody"></div>

</div>

</div>


<script>

let D={
site:{},
articles:[],
books:[]
};


/* حماية النصوص */
function esc(s){

return String(s??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}


/* إنشاء مفتاح آمن */
function safeKey(value){

return String(value)
.replace(/[^a-zA-Z0-9_-]/g,'_');

}


/* حساب الإعجابات المحلية */
function getLikeCount(id,type){

let key='al-adeeb-like-count-'+type+'-'+id;

return parseInt(
localStorage.getItem(key)||'0'
);

}


/* معرفة هل الزائر ضغط إعجاب */
function isLiked(id,type){

let key='al-adeeb-liked-'+type+'-'+id;

return localStorage.getItem(key)==='1';

}


/* قراءة التعليقات */
function getComments(id,type){

let key='al-adeeb-comments-'+type+'-'+id;

try{

return JSON.parse(
localStorage.getItem(key)||'[]'
);

}catch(e){

return [];

}

}


/* عرض التعليقات */
function loadComments(id,type){

let sid=safeKey(id);

let list=
document.getElementById(
'list-'+type+'-'+sid
);

if(!list)return;

let comments=getComments(id,type);

if(!comments.length){

list.innerHTML='';

return;

}

list.innerHTML=
comments.map(c=>`

<div class="comment-item">

${esc(c.text)}

<span class="comment-date">
${esc(c.date)}
</span>

</div>

`).join('');

}


/* فتح وإغلاق التعليقات */
function toggleComments(id,type){

let sid=safeKey(id);

let box=
document.getElementById(
'comments-'+type+'-'+sid
);

if(!box)return;

box.classList.toggle('show');

if(box.classList.contains('show')){

loadComments(id,type);

}

}


/* إضافة تعليق */
function addComment(id,type){

let sid=safeKey(id);

let input=
document.getElementById(
'input-'+type+'-'+sid
);

if(!input)return;

let text=input.value.trim();

if(!text){

alert('اكتب تعليقك أولاً');

return;

}

let comments=getComments(id,type);

comments.push({

text:text,

date:new Date().toLocaleString('ar-IQ')

});

let key='al-adeeb-comments-'+type+'-'+id;

localStorage.setItem(
key,
JSON.stringify(comments)
);

input.value='';

loadComments(id,type);

}


/* الإعجاب */
function toggleLike(id,type){

let sid=safeKey(id);

let keyLiked=
'al-adeeb-liked-'+type+'-'+id;

let keyCount=
'al-adeeb-like-count-'+type+'-'+id;

let liked=
localStorage.getItem(keyLiked)==='1';

let count=
parseInt(
localStorage.getItem(keyCount)||'0'
);

let button=
document.getElementById(
'like-'+type+'-'+sid
);

let number=
document.getElementById(
'count-'+type+'-'+sid
);


if(liked){

localStorage.removeItem(keyLiked);

count=Math.max(0,count-1);

if(button){

button.classList.remove('liked');

button.innerHTML=
'♡ إعجاب <span id="count-'+type+'-'+sid+'">'+count+'</span>';

}

}else{

localStorage.setItem(keyLiked,'1');

count++;

if(button){

button.classList.add('liked');

button.innerHTML=
'♥ أعجبني <span id="count-'+type+'-'+sid+'">'+count+'</span>';

}

}

localStorage.setItem(
keyCount,
count
);

if(number){

number.textContent=count;

}

}


/* مشاركة المحتوى */
function shareContent(id,type,title){

let url=
window.location.origin+
window.location.pathname;

if(type==='article'){

url+='?article='+encodeURIComponent(id);

}else{

url+='?book='+encodeURIComponent(id);

}


if(navigator.share){

navigator.share({

title:title||'Al-Adeeb',

text:'مشاركة من موقع Al-Adeeb',

url:url

}).catch(()=>{});

}else if(navigator.clipboard){

navigator.clipboard.writeText(url)
.then(()=>{

alert('تم نسخ رابط المشاركة');

})
.catch(()=>{

prompt(
'انسخ رابط المشاركة:',
url
);

});

}else{

prompt(
'انسخ رابط المشاركة:',
url
);

}

}


/* إنشاء أزرار التفاعل */
function interactionHTML(id,type,title){

let sid=safeKey(id);

let count=getLikeCount(id,type);

let liked=isLiked(id,type);

return `

<div class="interactions">

<button
class="interaction-btn"
onclick="shareContent(
'${String(id).replace(/'/g,"\\'")}',
'${type}',
'${String(title||'Al-Adeeb').replace(/'/g,"\\'")}'
)">
↗ مشاركة
</button>


<button
class="interaction-btn ${liked?'liked':''}"
id="like-${type}-${sid}"
onclick="toggleLike(
'${String(id).replace(/'/g,"\\'")}',
'${type}'
)">

${liked?'♥ أعجبني':'♡ إعجاب'}

<span id="count-${type}-${sid}">
${count}
</span>

</button>


<button
class="interaction-btn"
onclick="toggleComments(
'${String(id).replace(/'/g,"\\'")}',
'${type}'
)">
💬 تعليق
</button>


<div
class="comment-box"
id="comments-${type}-${sid}"
>

<textarea
class="comment-input"
id="input-${type}-${sid}"
placeholder="اكتب تعليقك هنا..."
></textarea>

<button
class="comment-submit"
onclick="addComment(
'${String(id).replace(/'/g,"\\'")}',
'${type}'
)">
إضافة التعليق
</button>

<div
class="comments-list"
id="list-${type}-${sid}">
</div>

</div>

</div>

`;

}


/* عرض المقالات والكتب */
function render(){

let q=
search.value.toLowerCase();


/* المقالات */

articlesGrid.innerHTML=

D.articles

.filter(x=>

(
x.title+' '+
x.category+' '+
x.excerpt+' '+
x.body
)
.toLowerCase()
.includes(q)

)

.map(x=>`

<article class="card">

${x.image?

`<img
class="card-image"
src="${esc(x.image)}"
alt="${esc(x.title)}"
loading="lazy">`

:''}


<div class="tag">
${esc(x.category)}
</div>


<h3>
${esc(x.title)}
</h3>


<p>
${esc(x.excerpt)}
</p>


<a
class="read"
href="article.html?id=${encodeURIComponent(x.id)}">
قراءة المقال ←
</a>


${interactionHTML(
x.id,
'article',
x.title
)}

</article>

`)

.join('')

||'<p>لا توجد نتائج.</p>';


/* الكتب */

booksGrid.innerHTML=

D.books

.map(x=>`

<article class="card">

${x.image?

`<img
class="card-image"
src="${esc(x.image)}"
alt="${esc(x.title)}"
loading="lazy">`

:''}


<div class="tag">
كتاب
</div>


<h3>
${esc(x.title)}
</h3>


<p>
${esc(x.description)}
</p>


${x.url?

`<a
class="read"
href="${esc(x.url)}"
target="_blank"
rel="noopener">
فتح الكتاب ←
</a>`

:''}


${interactionHTML(
x.id||x.title,
'book',
x.title
)}

</article>

`)

.join('')

||'<p>لا توجد كتب بعد.</p>';

}


/* النافذة المنبثقة */
function openA(id){

let x=
D.articles.find(
a=>a.id===id
);

if(!x)return;

modalBody.innerHTML=`

<div class="tag">
${esc(x.category)} · ${esc(x.date||'')}
</div>

<h2>
${esc(x.title)}
</h2>

<p>
${esc(x.body).replace(/\n/g,'<br>')}
</p>

`;

modal.classList.add('show');

}


/* إغلاق النافذة */
function closeModal(){

modal.classList.remove('show');

}


/* البحث */
search.oninput=render;


/* تحميل المحتوى */
fetch('content.json?'+Date.now())

.then(r=>r.json())

.then(x=>{

D=x;


desc.textContent=
x.site?.description||'';


tagline.textContent=
x.site?.tagline||
'مساحة للقراءة والفكرة';


aboutTitle.textContent=
'أهلاً بك في '+
(x.site?.name||'Al-Adeeb');


aboutText.textContent=
x.site?.description||'';


render();

})


.catch(()=>{

desc.textContent=
'تعذر تحميل المحتوى حالياً.';

});

</script>

</body>
</html>
