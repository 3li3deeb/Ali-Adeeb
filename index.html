<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ali Adeeb | مقالات وكتب</title>
<style>:root{--bg:#f7f5f0;--card:#fff;--text:#18201d;--muted:#69716d;--accent:#9a6b35;--line:#e7e0d5;--dark:#17211e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif;line-height:1.9}a{text-decoration:none;color:inherit}nav{position:sticky;top:0;z-index:5;background:#f7f5f0ee;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.nav{max-width:1120px;width:92%;margin:auto;height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:22px;direction:ltr}.brand span{color:var(--accent)}.links{display:flex;gap:24px;color:#4f5954;font-size:14px}.hero{max-width:1120px;width:92%;margin:auto;padding:75px 0 60px;display:grid;grid-template-columns:1.2fr .8fr;gap:50px;align-items:center}.kicker{color:var(--accent);font-weight:700;font-size:14px}h1{font-family:Georgia,serif;font-size:clamp(50px,7vw,82px);line-height:1;margin:12px 0 20px;direction:ltr;text-align:right}.hero p{font-size:18px;color:var(--muted)}.btn{display:inline-block;padding:11px 21px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:14px;margin:10px 6px 0 0}.primary{background:var(--dark);color:white}.visual{min-height:340px;border-radius:26px;background:linear-gradient(145deg,#18231f,#34443c);display:flex;align-items:center;justify-content:center}.monogram{font-family:Georgia,serif;font-size:78px;color:#f1e8d9;direction:ltr}section{max-width:1120px;width:92%;margin:auto;padding:55px 0}.head{margin-bottom:22px}.head h2{margin:0;font-size:28px}.head p{color:var(--muted)}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:24px}.tag{color:var(--accent);font-size:12px;font-weight:800}.card h3{margin:8px 0}.card p{color:var(--muted);font-size:14px}.read{display:inline-block;margin-top:15px;color:var(--accent);font-weight:800}.about{background:var(--dark);color:#eef0ed;border-radius:25px;padding:45px}.about p{color:#bfc8c3}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{background:white;max-width:760px;width:100%;max-height:90vh;overflow:auto;border-radius:18px;padding:30px}.close{float:left;border:0;background:none;font-size:25px}footer{padding:32px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}@media(max-width:800px){.links{display:none}.hero{grid-template-columns:1fr}.visual{min-height:240px}.grid{grid-template-columns:1fr}}</style></head><body>
<nav><div class="nav"><a class="brand" href="#">Ali <span>Adeeb</span></a><div class="links"><a href="#articles">المقالات</a><a href="#books">الكتب</a><a href="#about">عن الموقع</a></div></div></nav>
<section class="hero"><div><div class="kicker" id="tagline">مساحة للقراءة والفكرة</div><h1>Ali Adeeb</h1><p id="desc"></p><a class="btn primary" href="#articles">استكشف المقالات</a><a class="btn" href="#books">تصفح الكتب</a></div><div class="visual"><div class="monogram">AA</div></div></section>
<section id="articles"><div class="head"><h2>أحدث المقالات</h2><p>أفكار وقراءات متنوعة.</p></div><input id="search" class="search" placeholder="ابحث في المقالات والكتب..."><div id="articlesGrid" class="grid"></div></section>
<section id="books"><div class="head"><h2>الكتب</h2><p>مكتبة قابلة للتوسع.</p></div><div id="booksGrid" class="grid"></div></section>
<section id="about"><div class="about"><div class="kicker">عن الموقع</div><h2 id="aboutTitle">أهلاً بك في Ali Adeeb</h2><p id="aboutText">مساحة شخصية للنشر والمعرفة.</p></div></section><footer>© 2026 Ali Adeeb — جميع الحقوق محفوظة</footer>
<div id="modal" class="modal" aria-hidden="true"><div class="dialog"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<script>let D={site:{},articles:[],books:[]},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){let q=search.value.toLowerCase();articlesGrid.innerHTML=D.articles.filter(x=>(x.title+' '+x.category+' '+x.excerpt+' '+x.body).toLowerCase().includes(q)).map(x=>`<article class="card"><div class="tag">${esc(x.category)}</div><h3>${esc(x.title)}</h3><p>${esc(x.excerpt)}</p><a class="read" href="#" onclick="openA('${esc(x.id)}');return false">قراءة المقال ←</a></article>`).join('')||'<p>لا توجد نتائج.</p>';booksGrid.innerHTML=D.books.map(x=>`<article class="card"><div class="tag">كتاب</div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>${x.url?`<a class="read" href="${esc(x.url)}" target="_blank" rel="noopener">فتح الكتاب ←</a>`:''}</article>`).join('')||'<p>لا توجد كتب بعد.</p>'}function openA(id){let x=D.articles.find(a=>a.id===id);if(!x)return;modalBody.innerHTML=`<div class="tag">${esc(x.category)} · ${esc(x.date||'')}</div><h2>${esc(x.title)}</h2><p>${esc(x.body).replace(/\n/g,'<br>')}</p>`;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}search.oninput=render;fetch('content.json?'+Date.now()).then(r=>r.json()).then(x=>{D=x;desc.textContent=x.site?.description||'';tagline.textContent=x.site?.tagline||'مساحة للقراءة والفكرة';aboutTitle.textContent='أهلاً بك في '+(x.site?.name||'Ali Adeeb');aboutText.textContent=x.site?.description||'';render()}).catch(()=>{desc.textContent='تعذر تحميل المحتوى حالياً.'});</script></body></html>
