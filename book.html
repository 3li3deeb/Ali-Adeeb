<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Adeeb | كتاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f5f0;color:#17211e;font-family:"Amiri",Tahoma,Arial,sans-serif;line-height:2}.wrap{max-width:900px;width:92%;margin:auto;padding:35px 0}.back{color:#9a6b35;font-weight:bold}.book{background:#fff;border:1px solid #e5ded3;border-radius:18px;padding:28px;margin-top:20px}.cover{max-width:320px;width:100%;max-height:430px;object-fit:cover;border-radius:12px;display:block;margin:15px auto}h1{font-size:40px}.author{color:#a06d36;font-weight:bold}.reader{width:100%;height:75vh;border:1px solid #ddd;border-radius:10px;margin-top:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:15px;border-top:1px solid #e3ddd2}.btn{border:1px solid #e3ddd2;background:#fff;border-radius:9px;padding:8px 13px;font:inherit;cursor:pointer}.liked{color:#9a6b35;background:#f7eee5}.comment-box{display:none;width:100%;margin-top:10px}.comment-box.show{display:block}.comment-input{width:100%;min-height:90px;padding:10px;border:1px solid #ddd;border-radius:10px;font:inherit}.comment-submit{margin-top:7px;background:#17211e;color:#fff;border:0;border-radius:9px;padding:8px 14px;font:inherit}.comment-item{background:#f7f5f0;border-radius:10px;padding:9px;margin-top:7px;font-size:14px}.download{display:inline-block;background:#17211e;color:#fff;border-radius:9px;padding:9px 15px;font-weight:bold}
</style></head><body><main class="wrap"><a id="back" class="back">← العودة إلى المكتبة</a><div class="book"><div class="author" id="tag">كتاب</div><h1 id="title">جاري تحميل الكتاب...</h1><div id="author" class="author"></div><img id="cover" class="cover" style="display:none"><p id="desc"></p><div id="actions"></div><div id="reader"></div></div></main>
<script>
const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function sk(){return String(id).replace(/[^a-zA-Z0-9_-]/g,'_')}function lc(){return +localStorage.getItem('al-adeeb-like-count-book-'+id)||0}function il(){return localStorage.getItem('al-adeeb-liked-book-'+id)==='1'}function cs(){try{return JSON.parse(localStorage.getItem('al-adeeb-comments-book-'+id)||'[]')}catch{return[]}}
function renderActions(x){let c=lc(),l=il();return `<div class="actions"><button id="like" class="btn ${l?'liked':''}" onclick="like()"> ${l?'♥ أعجبني':'♡ إعجاب'} <span id="count">${c}</span></button><button class="btn" onclick="share()">↗ مشاركة</button><button class="btn" onclick="commentsToggle()">💬 تعليق</button>${x.file?`<a class="download" href="${esc(x.file)}" download>⬇ تحميل الكتاب</a>`:''}<div id="cb" class="comment-box"><textarea id="ci" class="comment-input" placeholder="اكتب تعليقك هنا..."></textarea><button class="comment-submit" onclick="addComment()">إضافة التعليق</button><div id="cl"></div></div></div>`}
function like(){let l=il(),c=lc()+(l?-1:1);localStorage.setItem('al-adeeb-liked-book-'+id,l?'0':'1');localStorage.setItem('al-adeeb-like-count-book-'+id,Math.max(0,c));location.reload()}
function share(){if(navigator.share)navigator.share({title:document.title,url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href).then(()=>alert('تم نسخ الرابط'))}
function commentsToggle(){$('cb').classList.toggle('show');loadComments()}function loadComments(){$('cl').innerHTML=cs().map(c=>`<div class="comment-item">${esc(c.text)}<small>${esc(c.date)}</small></div>`).join('')}
function addComment(){let i=$('ci'),t=i.value.trim();if(!t)return;let a=cs();a.push({text:t,date:new Date().toLocaleString('ar-IQ')});localStorage.setItem('al-adeeb-comments-book-'+id,JSON.stringify(a));i.value='';loadComments()}
fetch('content.json?'+Date.now()).then(r=>r.json()).then(D=>{let x=(D.books||[]).find(b=>String(b.id)===String(id));if(!x){$('title').textContent='الكتاب غير موجود';return}
document.title=(x.title||'كتاب')+' | Al-Adeeb';$('title').textContent=x.title||'';$('author').textContent=x.author?'✍️ '+x.author:'';$('desc').textContent=x.description||'';if(x.image){$('cover').src=x.image;$('cover').alt=x.title;$('cover').style.display='block'}
$('back').href='./?return=book-card-'+encodeURIComponent(x.id||x.title);$('actions').innerHTML=renderActions(x);
if(x.file){$('reader').innerHTML=`<iframe class="reader" src="${esc(x.file)}#toolbar=1"></iframe>`}else if(x.url){$('reader').innerHTML=`<iframe class="reader" src="${esc(x.url)}#toolbar=1"></iframe>`}loadComments();
}).catch(()=>$('title').textContent='تعذر تحميل الكتاب');
</script></body></html>
